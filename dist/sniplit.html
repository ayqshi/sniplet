<style>
/* sniplit v2 — smooth, light, monochrome */
:root{
  --bg:#060606;--bg2:#0c0c0c;--card:#121212;--card2:#191919;--line:#1f1f1f;--line2:#2b2b2b;
  --fg:#f4f4f4;--mut:#8e8e8e;--mut2:#575757;--acc:#fff;--accfg:#000;--glow:rgba(255,255,255,.06);
  --r:14px;--r2:20px;--side:248px;--tabh:60px;--mini:70px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,.8,.24,1);--spring:cubic-bezier(.34,1.4,.5,1);
  font-family:Inter,"SF Pro Text",-apple-system,system-ui,Segoe UI,Roboto,sans-serif;color-scheme:dark}
body.light{--bg:#f7f7f7;--bg2:#efefef;--card:#fff;--card2:#f1f1f1;--line:#e6e6e6;--line2:#d6d6d6;--fg:#0b0b0b;--mut:#6a6a6a;--mut2:#a5a5a5;--glow:rgba(0,0,0,.05);color-scheme:light}
/* ---------- design tokens: every surface, state and control reads from these, in every theme ---------- */
:root{--hover:rgba(255,255,255,.055);--press:rgba(255,255,255,.09);--sel:rgba(255,255,255,.16);--overlay:rgba(0,0,0,.55);--shadow:0 12px 40px rgba(0,0,0,.45);--shadow-s:0 2px 10px rgba(0,0,0,.35);
  --input:var(--card2);--input-line:var(--line);--focus:color-mix(in srgb,var(--fg) 55%,transparent);--danger:#ff5a5a;--ok:#5fd38d;--warn:#f5c451;--track:var(--line2);--thumb:var(--fg);--sk-a:#141414;--sk-b:#1d1d1d;
  --tb:env(titlebar-area-height,0px);--tbx:env(titlebar-area-x,0px);--tbw:env(titlebar-area-width,100vw)}
body.light{--hover:rgba(0,0,0,.045);--press:rgba(0,0,0,.08);--sel:rgba(0,0,0,.12);--overlay:rgba(20,20,20,.35);--shadow:0 12px 40px rgba(0,0,0,.12);--shadow-s:0 2px 10px rgba(0,0,0,.08);--input:#fff;--input-line:var(--line2);--danger:#d93636;--ok:#1f9d55;--warn:#b7791f;--sk-a:#ececec;--sk-b:#f6f6f6}
body.light .card,body.light .sheet,body.light #sheet{box-shadow:var(--shadow-s)}
body.light .tile .art,body.light .np-art{box-shadow:0 8px 24px rgba(0,0,0,.1)}
@media (prefers-contrast:more){:root{--mut:#b5b5b5;--line:#3a3a3a;--line2:#555}body.light{--mut:#3f3f3f;--line:#bdbdbd;--line2:#8f8f8f}}
@media (forced-colors:active){.pill,.chip,.toggle{border:1px solid CanvasText}}
::selection{background:var(--sel);color:var(--fg)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:10px}
input::placeholder,textarea::placeholder{color:var(--mut2);opacity:1}
input[type=range]{accent-color:var(--fg)}input[type=checkbox],input[type=radio]{accent-color:var(--fg);width:auto}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
hr{border:0;height:1px;background:var(--line);margin:18px 0}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:12.5px}
code,kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.icon-btn:hover,.tag.btn:hover,.chip:hover{background:var(--hover)}.icon-btn:active,.tag.btn:active,.chip:active{background:var(--press)}
.danger,.pill.danger{color:var(--danger)!important;box-shadow:inset 0 0 0 1px var(--danger)}
/* ---------- fit everything to the viewport, every layout ---------- */
img,video,canvas,svg,iframe{max-width:100%}
.grow,.row>*,.friend>*,.tr>*,.opt>*,.set-row>*,.lib-row>*,.sec-h>*,.coll-h>*,.top-hit>*{min-width:0}
h1,h2,h3,b,p,small,.tt,.ta,.t,.s{overflow-wrap:anywhere}
h1{max-width:100%}
.row{flex-wrap:wrap}.row.nowrap{flex-wrap:nowrap}
#view{overflow-x:clip}
.card,.sheet-body,.legal{max-width:100%;overflow-wrap:anywhere}
/* ---------- installed app window: keep content clear of the title-bar controls ---------- */
.wco{display:none}
@media (display-mode:window-controls-overlay){
  .wco{display:block;position:fixed;top:0;left:0;right:0;height:var(--tb);background:var(--bg);-webkit-app-region:drag;app-region:drag;z-index:200}
  .wco b{position:absolute;left:calc(var(--tbx) + 14px);top:0;height:var(--tb);display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;color:var(--mut);letter-spacing:-.01em}
  #app,#np,#sheet,#story{top:var(--tb)!important}#side{padding-top:14px}
  #np{height:calc(100% - var(--tb))}}
body.electron .wco{display:block;position:fixed;top:0;left:0;right:0;height:var(--tb);background:var(--bg);-webkit-app-region:drag;z-index:200}
body.electron #app,body.electron #np,body.electron #story{top:var(--tb)!important}
body.electron.mac{--tb:30px}body.electron.mac .wco b{left:84px}
body.electron .wco b{position:absolute;left:14px;top:0;height:var(--tb);display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;color:var(--mut)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden;font-size:14px;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.35;cursor:default}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--mut2)}input.bad{border-color:#a33}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;--bgc:var(--bg)}
.reduce *{transition:none!important;animation:none!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:1fr auto}
#side{grid-row:1/3;border-right:1px solid var(--line);padding:calc(20px + var(--safe-t)) 12px 14px;display:flex;flex-direction:column;gap:2px;min-height:0;background:var(--bg)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px;letter-spacing:-.035em;padding:2px 12px 20px}
.logo svg{width:20px;height:20px}
.nav{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;color:var(--mut);font-weight:550;transition:color .2s,background .2s;position:relative}
.nav:hover{color:var(--fg)}.nav.on{color:var(--fg);background:var(--card)}
.dot{position:absolute;right:12px;min-width:18px;height:18px;border-radius:9px;background:var(--fg);color:var(--bg);font:700 11px/18px Inter,sans-serif;text-align:center;font-style:normal;padding:0 5px}
#tabs .dot{right:calc(50% - 18px);top:8px;min-width:8px;height:8px;padding:0}
.side-sep{height:1px;background:var(--line);margin:12px 8px}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 6px 12px;color:var(--mut);font-weight:600;font-size:13px}
.side-list{flex:1;overflow-y:auto;min-height:0;margin:0 -4px;padding:0 4px}
.side-item{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:10px;transition:background .2s}
.side-item:hover{background:var(--card)}.side-item img,.side-item .ph{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none}
.side-item b{display:block;font-weight:550;font-size:13.5px}.side-item small{color:var(--mut);font-size:12px}
.ph{display:grid;place-items:center;background:linear-gradient(140deg,var(--card2),var(--card));color:var(--mut);border:1px solid var(--line)}
.ph svg{width:18px;height:18px}
.me-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;margin-top:8px;color:var(--mut);font-weight:550}
.me-row:hover{background:var(--card);color:var(--fg)}.me-row .grow{color:var(--fg)}.crown svg{width:16px;height:16px}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none;text-shadow:0 1px 2px #0006;position:relative}
.av.ring{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
#main{overflow-y:auto;overflow-x:hidden;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#view{padding:calc(28px + var(--safe-t)) 36px calc(var(--mini) + 48px);max-width:1440px;margin:0 auto;min-height:100%}
#topbar,#tabs{display:none}

/* ---------- type & components ---------- */
h1{font-size:32px;letter-spacing:-.04em;margin:0 0 4px;font-weight:700;line-height:1.05}
h2{font-size:19px;letter-spacing:-.025em;margin:0;font-weight:650}
h3{font-size:15px;margin:0 0 4px;font-weight:620}
.sub{color:var(--mut);margin:0 0 22px;line-height:1.5}
.mut{color:var(--mut)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--mut);margin-bottom:6px}
.sec{margin:36px 0 0}.list-h{margin:28px 0 10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:10px}
.see{color:var(--mut);font-size:12.5px;font-weight:600}.see:hover{color:var(--fg)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 20px;border-radius:999px;background:var(--acc);color:var(--accfg);font-weight:650;font-size:14px;white-space:nowrap;transition:transform .25s var(--spring),opacity .2s,background .2s}
.pill svg{width:18px;height:18px}.pill:active{transform:scale(.95)}
.pill.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}.pill.ghost.light{color:#fff;box-shadow:inset 0 0 0 1px #ffffff55}
.pill.dim{background:var(--card2);color:var(--fg)}.pill.sm{height:34px;padding:0 15px;font-size:13px}.pill.wide{width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;padding:2px 0}
.chips::-webkit-scrollbar{display:none}.chips.wrap{flex-wrap:wrap}
.chip{height:34px;padding:0 15px;border-radius:999px;background:var(--card2);color:var(--fg);font-size:13px;font-weight:550;white-space:nowrap;transition:background .2s,color .2s,transform .2s var(--spring);display:inline-flex;align-items:center;gap:6px}
.chip:active{transform:scale(.95)}.chip.on{background:var(--fg);color:var(--bg)}.chip .ct{opacity:.5;font-weight:500}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:600;color:var(--mut);background:color-mix(in srgb,var(--fg) 7%,transparent)}
.tag svg{width:15px;height:15px}.tag.btn:hover,.tag.btn.on{color:var(--fg);background:color-mix(in srgb,var(--fg) 13%,transparent)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--fg);transition:background .2s,transform .25s var(--spring),color .2s;flex:none}
.icon-btn:hover{background:var(--card2)}.icon-btn:active{transform:scale(.9)}.icon-btn.sm{width:30px;height:30px}.icon-btn.sm svg{width:18px;height:18px}
.icon-btn.on{color:var(--fg)}.icon-btn.lg svg{width:28px;height:28px}
.icon-btn.pop{animation:pop .4s var(--spring)}@keyframes pop{50%{transform:scale(1.25)}}
.icon-btn.danger,.danger{color:#e66}
[data-act=loop][data-mode=one]::after,[data-act=loop][data-mode=forever]::after{position:absolute;font:800 8px Inter;margin:0 0 -16px 16px}
[data-act=loop]{position:relative}[data-act=loop][data-mode=one]::after{content:"1"}[data-act=loop][data-mode=forever]::after{content:"∞";font-size:10px}
[data-act=loop]:not(.on),[data-act=shuffle]:not(.on){color:var(--mut)}
.search{position:relative}.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut);width:19px;height:19px}
.search input{padding-left:44px;background:var(--card);border-radius:14px;height:48px}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:5px;background:var(--card2);color:var(--mut);vertical-align:middle}
.badge.e{background:var(--mut2);color:var(--bg);margin-right:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:20px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.grid-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.fade-in{animation:fi .4s var(--ease)}@keyframes fi{from{opacity:0;transform:translateY(8px)}}

.busy{position:relative;pointer-events:none;overflow:hidden;isolation:isolate}
.busy::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent 20%,color-mix(in srgb,var(--fg) 22%,transparent) 50%,transparent 80%);background-size:220% 100%;animation:busySweep 1.1s var(--ease-io) infinite;z-index:-1;pointer-events:none}

@keyframes spin{to{transform:rotate(360deg)}}
.nope{animation:nope .4s}@keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.empty{padding:48px 16px;text-align:center;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty-i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);margin-bottom:8px;color:var(--fg)}

.hint{background:var(--card);border:1px solid var(--line);padding:11px 14px;border-radius:12px;font-size:13px;color:var(--mut);margin:-4px 0 14px}
.offline-bar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--mut);margin-top:6px}

/* ---------- skeletons: soft glowing shimmer ---------- */
/* skeleton colors come from tokens */
.sk{position:relative;overflow:hidden;background:var(--card);animation:skglow 2.6s ease-in-out infinite}
.sk::after{content:"";position:absolute;inset:-20%;background:linear-gradient(105deg,transparent 30%,color-mix(in srgb,var(--fg) 5%,transparent) 42%,color-mix(in srgb,var(--fg) 13%,transparent) 50%,color-mix(in srgb,var(--fg) 5%,transparent) 58%,transparent 70%);filter:blur(8px);transform:translateX(-70%);animation:shine 1.9s cubic-bezier(.45,.05,.3,1) infinite}
@keyframes shine{to{transform:translateX(70%)}}
@keyframes skglow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 28px 2px var(--glow)}}
.shelf .tile:nth-child(2) .sk,.shelf .tile:nth-child(2) .sk::after{animation-delay:.12s}.shelf .tile:nth-child(3) .sk,.shelf .tile:nth-child(3) .sk::after{animation-delay:.24s}.shelf .tile:nth-child(4) .sk,.shelf .tile:nth-child(4) .sk::after{animation-delay:.36s}.shelf .tile:nth-child(5) .sk,.shelf .tile:nth-child(5) .sk::after{animation-delay:.48s}
.hero.sk{min-height:280px;border-radius:24px}
.ly-sk{padding:30% 8px;display:flex;flex-direction:column;gap:18px}.ly-sk .sk{height:26px;border-radius:9px}
img{transition:opacity .45s var(--ease)}.art img,.tr img{opacity:0}.art img.ld,.tr img.ld{opacity:1}

/* ---------- tiles & lists ---------- */
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(148px,168px);gap:16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none;overscroll-behavior-x:contain}
.shelf::-webkit-scrollbar{display:none}
.tile{scroll-snap-align:start;cursor:pointer;min-width:0}
.art{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card)}
.art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease),opacity .45s}
body.mono .art img,body.mono .np-art img,body.mono .mix img{filter:grayscale(1) contrast(1.06)}
.tile:hover .art img{transform:scale(1.035)}
.art .play{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--accfg);display:grid;place-items:center;opacity:0;transform:translateY(6px) scale(.9);transition:.3s var(--spring);box-shadow:0 8px 20px #0006}
.art .play svg{width:18px;height:18px;margin-left:2px}.tile:hover .play,.tile:focus-visible .play{opacity:1;transform:none}
.art .cached{position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff}.art .cached svg{width:15px;height:15px}
.tile .t{margin-top:10px;font-weight:600;font-size:13.5px}.tile .s{color:var(--mut);font-size:12.5px;margin-top:2px}
.tile.round .art{border-radius:50%}.tile.round{text-align:center}
.mixes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mix{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;min-height:68px;padding-right:14px;transition:background .2s}
.mix:hover{background:var(--card2)}.mix img{width:68px;height:68px;object-fit:cover;flex:none}.mix>div{padding:10px 0 10px 14px}.mix img+div{padding-left:0}
.mix b{display:block;font-size:14.5px;font-weight:650}.mix small{color:var(--mut);font-size:12px}
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.genre{position:relative;height:96px;border-radius:16px;overflow:hidden;text-align:left;padding:14px;background:linear-gradient(135deg,hsl(var(--h) 0% 18%),hsl(var(--h) 0% 7%));border:1px solid var(--line);display:flex;align-items:flex-end}
.genre b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.tl{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:28px 46px 1fr auto auto;gap:12px;align-items:center;padding:7px 8px;border-radius:10px;cursor:pointer;transition:background .15s}
.tr:hover{background:var(--card)}.tr.on .tt{color:var(--acc)}
.tr .n{color:var(--mut);font-size:12.5px;text-align:center;font-variant-numeric:tabular-nums}
.tr img{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--card2)}
.tr .tt{font-weight:550}.tr .ta{color:var(--mut);font-size:12.5px;margin-top:2px;display:flex;gap:6px;align-items:center}
.dl-i svg{width:14px;height:14px;color:var(--fg)}.tr .d{color:var(--mut);font-size:12.5px;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.tr .vers{font-size:11px;color:var(--mut);border:1px solid var(--line2);border-radius:6px;padding:1px 6px}
.top-hit{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--card);margin-bottom:8px}
.top-hit img{width:60px;height:60px;border-radius:50%;object-fit:cover}.top-hit b{font-size:17px;display:block}.top-hit small{color:var(--mut)}
.lib-list{display:flex;flex-direction:column;gap:2px}
.lib-row{display:flex;align-items:center;gap:14px;padding:8px;border-radius:12px;cursor:pointer;color:var(--mut)}
.lib-row:hover{background:var(--card)}.lib-row img,.lib-row .ph{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
.lib-row b{color:var(--fg);display:block;font-weight:600}.lib-row small{font-size:12.5px}
.coll-h{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.coll-h>img,.cover-liked{width:200px;height:200px;border-radius:18px;object-fit:cover;box-shadow:0 24px 60px #0007}
.coll-h.small{align-items:center}.coll-h h1{font-size:clamp(30px,4.6vw,52px)}
.cover-liked{display:grid;place-items:center;background:linear-gradient(140deg,#f2f2f2,#5a5a5a);color:#111}.cover-liked svg{width:64px;height:64px}

/* ---------- home: stories ---------- */
.home-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.stories{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 14px;overscroll-behavior-x:contain}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:7px;width:68px;font-size:11.5px;color:var(--mut);font-weight:550}
.story .av.ring{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--fg)}.story span.ell{max-width:68px}
.modes{margin:4px 0 6px}

/* ---------- mini player ---------- */
#mini{grid-column:2;height:calc(var(--mini) + 2px);border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(220px,1fr);align-items:center;padding:0 18px;gap:16px;position:relative;z-index:20;touch-action:none}
#mini.hide{display:none}
#mini .mi{display:flex;gap:12px;align-items:center;min-width:0;cursor:pointer;transition:transform .3s var(--ease)}
#mini .mi img{width:48px;height:48px;border-radius:9px;object-fit:cover;background:var(--card2)}.mt{font-weight:600}
#mini .ctr{display:flex;align-items:center;gap:6px}
#mini .ctr .pp{width:44px;height:44px;background:var(--acc);color:var(--accfg);border-radius:50%;display:grid;place-items:center;transition:transform .25s var(--spring)}
#mini .ctr .pp:active{transform:scale(.9)}#mini .ctr .pp svg{width:20px;height:20px}
#mini .rt{display:flex;justify-content:flex-end;align-items:center;gap:2px}
#mini .prog{position:absolute;left:0;right:0;top:-1px;height:2px}#mini .prog i{display:block;height:100%;background:var(--fg);width:0;border-radius:2px}
.vol-wrap{display:inline-flex;align-items:center;gap:6px;color:var(--mut);margin-left:6px}.vol{width:96px}

/* ---------- now playing ---------- */
#np{position:fixed;inset:0;z-index:60;background:var(--bg);transform:translateY(102%);transition:transform .5s var(--ease);display:flex;flex-direction:column;overflow:hidden;touch-action:none}
#np.on{transform:none}
#np .grab,#sheet .grab{display:none;width:38px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 0}
#np .bgblur{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(80px) saturate(.5) brightness(.32);transform:scale(1.15);transition:background-image .8s}
body.mono #np .bgblur{filter:blur(80px) grayscale(1) brightness(.38)}
body.light #np .bgblur{filter:blur(80px) saturate(.3) brightness(1.5);opacity:.5}
.np-top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-t)) 16px 4px}
.np-top .ctx{text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0;max-width:60%}
.np-top .ctx span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.14em;font-weight:600}.np-top .ctx b{font-size:13px;font-weight:600}
.np-body{position:relative;flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;padding:8px 6vw 20px;min-height:0;align-items:center}
.np-left{display:flex;flex-direction:column;gap:18px;max-width:500px;width:100%;justify-self:center}
.np-art{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--card2);box-shadow:0 30px 80px rgba(0,0,0,.55);cursor:pointer;transition:transform .5s var(--spring)}
.np-art img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease),filter .5s}
#np:not(.playing) .np-art img{transform:scale(.94)}
.np-art .viz{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .5s;pointer-events:none}
.np-art.viz-on img{filter:blur(18px) brightness(.35)!important}.np-art.viz-on .viz{opacity:1}
.np-art.nudge{animation:nope .4s}
.np-art .yt{position:absolute;inset:0;display:none}
.adlock{position:absolute;left:10px;top:10px;background:#000c;color:#fff;font-size:11px;font-weight:700;padding:5px 9px;border-radius:6px;display:none;z-index:3}.adlock.on{display:block}
.np-meta{display:flex;align-items:center;gap:12px}
.np-meta .t{font-size:24px;font-weight:700;letter-spacing:-.035em}.np-meta .a{color:var(--mut);margin-top:3px;cursor:pointer;font-size:15px}
.like.on{color:var(--fg)}
.src-row{display:flex;gap:6px;flex-wrap:wrap}
.seek{position:relative;height:24px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.seek .bar{height:4px;border-radius:4px;background:color-mix(in srgb,var(--fg) 16%,transparent);flex:1;position:relative;transition:height .2s}
.seek:hover .bar,.seek:active .bar{height:6px}
.seek .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--fg);border-radius:4px}
.seek .bar b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--fg);box-shadow:0 2px 8px #0005;transform:scale(.8);transition:transform .2s}
.seek:hover .bar b,.seek:active .bar b{transform:scale(1)}
.seek .bar u{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--fg) 14%,transparent);border-radius:4px}
.times{display:flex;justify-content:space-between;color:var(--mut);font-size:11.5px;margin-top:-6px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:space-between}
.ctrls .big{width:68px;height:68px;border-radius:50%;background:var(--acc);color:var(--accfg);display:grid;place-items:center;transition:transform .25s var(--spring);box-shadow:0 10px 30px #0005}
.ctrls .big:active{transform:scale(.92)}.ctrls .big svg{width:28px;height:28px}
.np-actions{display:flex;justify-content:space-between;color:var(--mut)}.np-actions .icon-btn{color:var(--mut)}.np-actions .icon-btn.on,.np-actions .icon-btn:hover{color:var(--fg)}
.np-note,.sheet-note{font-size:12.5px;color:var(--mut);text-align:center;min-height:0;max-height:0;overflow:hidden;opacity:0;transition:.35s var(--ease)}
.np-note.on,.sheet-note.on{max-height:40px;opacity:1;margin-top:6px}
.np-right{height:100%;min-height:0;display:flex;flex-direction:column;padding-top:8px}
.seg-u{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:18px 0 12px;overflow-x:auto;scrollbar-width:none}
.seg-u::-webkit-scrollbar{display:none}
.seg-u button{padding:10px 0;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .2s}
.seg-u button.on{color:var(--fg);border-color:var(--fg)}.np-tabs{margin:0 0 10px}
.np-pane{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:pan-y}

/* ---------- lyrics ---------- */
.ly{position:absolute;inset:0;overflow:hidden;mask-image:linear-gradient(transparent,#000 16%,#000 74%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 74%,transparent);touch-action:none;cursor:grab}
.ly-in{position:absolute;left:0;right:0;top:0;padding:40% 8px 60%;will-change:transform}
.ly-l{font-size:clamp(22px,2.3vw,32px);font-weight:700;letter-spacing:-.03em;line-height:1.24;margin:0 0 .55em;opacity:.26;transition:opacity .4s,transform .5s var(--ease),filter .4s;transform-origin:left center;cursor:pointer;filter:blur(.7px)}
.ly-l.on{opacity:1;filter:none;transform:scale(1.025)}.ly-l.past{opacity:.4;filter:none}.ly-l.out{opacity:.1}
.ly-l .w{background:linear-gradient(90deg,var(--fg) var(--p,0%),color-mix(in srgb,var(--fg) 36%,transparent) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent}
.ly-l.instr{letter-spacing:.3em}.ly-l.nope{animation:nope .4s}
.ly-tools{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:6px;justify-content:center;padding:10px;z-index:3;flex-wrap:wrap}

.sync-badge{position:absolute;top:6px;right:6px;z-index:3;font-size:11px;font-weight:600;color:var(--mut);padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--fg) 7%,transparent)}
.resync{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:4;display:none}.resync.on{display:inline-flex}

/* ---------- sheets ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(2px)}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:100;left:50%;top:50%;width:min(540px,94vw);max-height:86vh;overflow:auto;overscroll-behavior:contain;background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:22px;transform:translate(-50%,-47%) scale(.97);opacity:0;pointer-events:none;transition:transform .35s var(--ease),opacity .25s;box-shadow:0 40px 100px #000a;touch-action:pan-y}
#sheet.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}#sheet.wide{width:min(820px,96vw)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:12px;cursor:pointer;transition:background .15s}
.opt:hover{background:var(--card)}.opt .grow small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.opt-art{width:44px;height:44px;border-radius:8px;object-fit:cover}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--mut2);flex:none;transition:.2s}.radio.on{border:5px solid var(--fg)}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:2px;border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:8px 10px;border-radius:9px;color:var(--mut);font-weight:600;font-size:12.5px;white-space:nowrap;transition:.2s}.seg button.on{background:var(--card2);color:var(--fg)}
.sl{display:grid;grid-template-columns:96px 1fr 60px;gap:12px;align-items:center;margin:14px 0}.sl label{color:var(--mut);font-size:12.5px}
.sl output{font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;padding:0;border:0;height:24px;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line2);border-radius:4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--fg);margin-top:-7px;box-shadow:0 2px 8px #0005}
input[type=range]::-moz-range-track{height:4px;background:var(--line2);border-radius:4px}input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--fg);border:0}
.eq{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;height:180px;margin:10px 0}.eq div{display:flex;flex-direction:column;align-items:center;gap:6px}
.eq input{writing-mode:vertical-lr;direction:rtl;flex:1;width:24px}.eq span{font-size:10px;color:var(--mut)}
.wave{height:84px;border-radius:14px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;margin:14px 0 8px;touch-action:none}.wave canvas{width:100%;height:100%;display:block}
.toggle{width:44px;height:26px;border-radius:999px;background:var(--line2);position:relative;transition:background .25s;flex:none}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:transform .3s var(--spring),background .25s}
.toggle.on{background:var(--fg)}.toggle.on::after{transform:translateX(18px);background:var(--bg)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.set-row:last-child{border:0}
.set-row small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.swatches{display:flex;gap:10px}.sw{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px #0003}.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.progress{height:5px;border-radius:5px;background:var(--line2);overflow:hidden}.progress i{display:block;height:100%;background:var(--fg);width:0;transition:width .3s}
.drop{border:1.5px dashed var(--line2);border-radius:20px;padding:30px;text-align:center;color:var(--mut);transition:.2s}.drop>svg{width:30px;height:30px}
.drop.over{border-color:var(--fg);color:var(--fg);background:var(--card)}
.share-row{display:flex;justify-content:space-around;margin:18px 0}
.share-row button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--mut);font-weight:550}
.share-row span{width:52px;height:52px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--fg)}

/* ---------- hero / premium ---------- */
.hero{position:relative;border-radius:24px;overflow:hidden;min-height:280px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:28px;background:var(--card);flex-wrap:wrap}
.hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center 30%;filter:grayscale(1) contrast(1.1) brightness(.5)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(0,0,0,.8))}
.hero>*:not(.bgimg){position:relative;z-index:1;color:#fff}.hero .kicker{color:#fffb}
.hero h1{font-size:clamp(36px,5.5vw,64px);letter-spacing:-.05em}
.hero.prem{background:radial-gradient(120% 140% at 85% 0%,#5a5a5a,#141414 55%,#0a0a0a)}.hero.prem p{color:#ccc;max-width:460px}
.cmp{padding:6px 0}.cmp-r{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px;padding:14px 20px;border-top:1px solid var(--line);font-size:13.5px}
.cmp-r:first-child{border:0}.cmp-r span:nth-child(2){color:var(--mut)}.cmp-r.head span{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}

/* ---------- friends ---------- */
.conn{font-size:12px;font-weight:600;color:var(--mut);display:inline-flex;align-items:center;gap:7px}
.conn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mut2)}.conn.on::before{background:#5fd38d;box-shadow:0 0 10px #5fd38d}
.me-card{display:flex;align-items:center;gap:14px;margin:6px 0 12px}.me-card input{background:transparent;border:0;padding:0;font-size:20px;font-weight:700;letter-spacing:-.03em}
.add-friend{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line)}

    catch(e){if(entity!=='song')return[];if(window.SSrc&&!window.SNIPLIT_FIXTURE){const dz=await SSrc.Deezer.search(term,25);if(dz.length)return dz}const q=term.toLowerCase().split(/\s+/).filter(Boolean);return localLibrary().filter(t=>q.every(w=>(t.title+' '+t.artist+' '+(t.album||'')).toLowerCase().includes(w)))}
  },
  async lookupMany(ids){if(!ids.length)return[];try{return(await itunes('lookup',{id:ids.join(',')})).filter(r=>r.kind==='song').map(toTrack)}catch(e){return[]}},
  async lookupTrack(id){const loc=localLibrary().find(t=>t.id===id);try{const r=await itunes('lookup',{id:String(id).replace('it:','')});return r[0]?toTrack(r[0]):loc||null}catch(e){return loc||null}},
  async artist(artistId){
    const[info,songs,albums]=await Promise.all([itunes('lookup',{id:artistId}),itunes('lookup',{id:artistId,entity:'song',limit:200,sort:'recent'}),itunes('lookup',{id:artistId,entity:'album',limit:200})]);
    const a=info[0]||{};return{info:{name:a.artistName,genre:a.primaryGenreName,url:a.artistLinkUrl},songs:songs.filter(x=>x.wrapperType==='track').map(toTrack),albums:albums.filter(x=>x.wrapperType==='collection').map(toAlbum)}
  },
  async album(albumId){const r=await itunes('lookup',{id:albumId,entity:'song',limit:200});return{album:r[0]?toAlbum(r[0]):null,tracks:r.filter(x=>x.wrapperType==='track').map(toTrack)}},
  async popular(artistName){try{return(await itunes('search',{term:artistName,media:'music',entity:'song',attribute:'artistTerm',limit:50})).map(toTrack).filter(t=>artistKey(t.artist)===artistKey(artistName)||t.artist.toLowerCase().includes(artistName.toLowerCase()))}catch(e){return localLibrary().filter(t=>artistKey(t.artist)===artistKey(artistName))}},
  async genreTop(genre,limit=25){try{return(await itunes('search',{term:genre,media:'music',entity:'song',attribute:'genreIndex',limit})).map(toTrack)}catch(e){return localLibrary().filter(t=>t.genre===genre)}},
  async charts(){return[]},

  /** resolve a loose "artist – title" to the best catalog match */
  async resolve(artist,title,{gap=3100}={}){
    try{const r=(await itunes('search',{term:`${artist} ${title}`.slice(0,90),media:'music',entity:'song',limit:8},{gap})).map(toTrack);
      const bt=baseTitle(title),ak=artistKey(artist);return r.find(t=>baseTitle(t.title)===bt&&artistKey(t.artist).includes(ak.slice(0,6)))||r.find(t=>baseTitle(t.title)===bt)||r[0]||null}catch(e){return null}
  },

/* ---------------- TikTok-viral picks (curated seed list; refreshable) ---------------- */
const VIRAL_SEED=[['APT.','ROSÉ'],['Espresso','Sabrina Carpenter'],['Birds of a Feather','Billie Eilish'],['Good Luck, Babe!','Chappell Roan'],['Messy','Lola Young'],['Abracadabra','Lady Gaga'],
 ['Ordinary','Alex Warren'],['Sports car','Tate McRae'],['Manchild','Sabrina Carpenter'],['Golden','HUNTR/X'],['Pink Pony Club','Chappell Roan'],['Die With A Smile','Lady Gaga'],
 ['luther','Kendrick Lamar'],['Not Like Us','Kendrick Lamar'],['A Bar Song (Tipsy)','Shaboozey'],['Lose Control','Teddy Swims'],['Timeless','The Weeknd'],['Nokia','Drake'],['Bad Dreams','Teddy Swims'],['Taste','Sabrina Carpenter']];

/* ---------------- recommendation engine ---------------- */
function profile(){
  const g={},a={},seen=new Set();
  const add=(t,w)=>{if(!t)return;if(t.genre)g[t.genre]=(g[t.genre]||0)+w;const k=artistKey(t.artist);a[k]={w:((a[k]||{}).w||0)+w,name:t.artist.split(/,|&| feat/i)[0].trim(),id:t.artistId}};
  Object.values(Store.likes).forEach(t=>add(t,3));
  Store.history.slice(-400).forEach(h=>{add(h.track,h.full?1.2:.4);seen.add(h.track.id)});
  Object.entries(Store.ratings).forEach(([id,r])=>{const t=Store.likes[id]||Store.history.find(h=>h.track.id===id)?.track;if(t)add(t,(r-3)*1.2)});
  Object.values(Store.follows).forEach(f=>{const k=artistKey(f.name);a[k]={w:((a[k]||{}).w||0)+5,name:f.name,id:f.id};if(f.genre)g[f.genre]=(g[f.genre]||0)+2});
  const genres=Object.entries(g).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);const artists=Object.values(a).sort((x,y)=>y.w-x.w);
  return{genres,artists,seen,cold:artists.length===0};
}
/** collaborators parsed from credits = real "related artists" signal */
function collaborators(songs,mainName){const c={};for(const s of songs){const parts=(s.artist+' '+s.title).split(/,|&|feat\.?|ft\.|with|\bx\b|\(|\)/i).map(x=>x.trim()).filter(x=>x&&x.length>1&&x.length<40);
  for(const p of parts){if(artistKey(p)===artistKey(mainName)||baseTitle(p)===baseTitle(s.title))continue;if(/remix|version|edit|live|mix|deluxe|remaster/i.test(p))continue;if(s.artist.includes(p)||s.title.match(new RegExp('(feat|ft|with)[^)]*'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i')))c[p]=(c[p]||0)+1}}
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,12)}
/** Vault: underrated / deep cuts / bonus & unreleased-labelled tracks from an artist's full catalog */
function vault(songs,popular){
  const popIds=new Set(popular.slice(0,10).map(t=>baseTitle(t.title)));const popAlbums={};popular.slice(0,25).forEach((t,i)=>popAlbums[t.albumId]=(popAlbums[t.albumId]||0)+(25-i));
  const groups=groupVersions(songs);const out={gems:[],rare:[],live:[]};
  for(const g of groupVersions(songs).flatMap(x=>x.versions)){const s=g;const b=baseTitle(s.title);
    const rareTag=/(demo|unreleased|outtake|bonus|b-side|session|alternate|early (version|take)|rough|leak|interlude|voice memo|previously)/i.test(s.title+' '+s.album);
    if(rareTag){out.rare.push(s);continue}if(/\blive\b/i.test(s.title)){out.live.push(s);continue}if(popIds.has(b)||s.vtags.some(v=>v!=='Original'&&v!=='Explicit'&&v!=='Clean'))continue;
    {s._score=(popAlbums[s.albumId]||0)+(s.trackNo>1&&s.trackNo<12?3:0)+(s.durationMs>150000?2:0)+(s.explicit===Store.settings.explicit?1:0);out.gems.push(s)}}
  out.gems.sort((a,b)=>b._score-a._score);return out;
}
/** Hook score: rank tracks most likely to hook a given user */
function hookRank(tracks,prof){const gi={};prof.genres.forEach((g,i)=>gi[g]=Math.max(0,10-i));const ai={};prof.artists.forEach((a,i)=>ai[artistKey(a.name)]=Math.max(0,14-i));
  return tracks.filter(t=>!prof.seen.has(t.id)).map(t=>({t,s:(gi[t.genre]||0)+(ai[artistKey(t.artist)]||0)*.6+(Store.likes[t.id]?-20:0)+Math.random()*2})).sort((a,b)=>b.s-a.s).map(x=>x.t)}

/* ---------------- radio & podcasts ---------------- */
const Radio={async search({tag='',name='',limit=40}={}){
  const hosts=['de1','nl1','at1','fi1'];for(const h of hosts){try{const q=new URLSearchParams({limit,hidebroken:'true',order:'clickcount',reverse:'true',...(tag?{tag}:{}),...(name?{name}:{})});
    const r=await fetch(`https://${h}.api.radio-browser.info/json/stations/search?`+q);if(!r.ok)continue;const d=await r.json();
    return d.filter(s=>(s.url_resolved||'').startsWith('https')).map(s=>({id:'rd:'+s.stationuuid,src:'radio',live:true,title:s.name.trim(),artist:[s.country,s.tags&&s.tags.split(',')[0]].filter(Boolean).join(' · '),album:'Live radio',art:s.favicon&&s.favicon.startsWith('https')?s.favicon:placeholderArt(s.name),stream:s.url_resolved,genre:'Radio',durationMs:0,homepage:s.homepage}))}catch(e){}}
  return[]}};
const Pod={async search(term){try{return(await itunes('search',{term,media:'podcast',limit:30})).map(p=>({id:'pc:'+p.collectionId,pid:p.collectionId,title:p.collectionName,artist:p.artistName,art:art(p.artworkUrl100),genre:p.primaryGenreName,feed:p.feedUrl}))}catch(e){return[]}},
  async episodes(pid){try{return(await itunes('lookup',{id:pid,entity:'podcastEpisode',limit:60})).filter(x=>x.wrapperType==='podcastEpisode').map(e=>({id:'ep:'+e.trackId,src:'podcast',title:e.trackName,artist:e.collectionName,album:'Podcast',art:e.artworkUrl600||art(e.artworkUrl160),stream:e.episodeUrl,durationMs:e.trackTimeMillis||0,genre:'Podcast',release:e.releaseDate,desc:e.shortDescription||e.description||''}))}catch(e){return[]}}};

/* ---------------- YouTube (Data API key optional; IFrame always visible) ---------------- */
const ALLOWED_CATS=new Set(['1','2','10','15','19','22','24','25','26','27','28','29','35']);// film, music, pets, travel, people/blogs(podcasts), ent., news, howto, edu, sci-tech, nonprofits, documentary
const BLOCK_RE=/\b(gameplay|let'?s play|walkthrough|speedrun|fortnite|minecraft|roblox|valorant|gta|call of duty|twitch|stream highlights|live ?stream|kick\.com|irl stream|reaction compilation)\b/i;
const YT={
  async search(q,{max=15,music=false}={}){
    const key=Store.settings.ytKey;if(!key||window.SSrc){const r=window.SSrc?await SSrc.Video.search(q,{music,max}):[];if(r.length||!key)return r}
    const p=new URLSearchParams({part:'snippet',type:'video',q,maxResults:String(max),key,safeSearch:'moderate',videoEmbeddable:'true'});if(music)p.set('videoCategoryId','10');
    const r=await fetch('https://www.googleapis.com/youtube/v3/search?'+p);const d=await r.json();if(d.error)throw new Error(d.error.message);
    const ids=d.items.map(i=>i.id.videoId).join(',');if(!ids)return[];
    const v=await(await fetch('https://www.googleapis.com/youtube/v3/videos?'+new URLSearchParams({part:'snippet,contentDetails,liveStreamingDetails',id:ids,key}))).json();
    return(v.items||[]).filter(x=>ALLOWED_CATS.has(x.snippet.categoryId)&&!x.liveStreamingDetails&&x.snippet.liveBroadcastContent==='none'&&!BLOCK_RE.test(x.snippet.title+' '+x.snippet.channelTitle))
      .map(x=>({id:'yt:'+x.id,src:'youtube',ytId:x.id,title:x.snippet.title.replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"'),artist:x.snippet.channelTitle,album:'YouTube',art:(x.snippet.thumbnails.high||x.snippet.thumbnails.medium||{}).url,durationMs:isoDur(x.contentDetails.duration)*1000,genre:'Video',cat:x.snippet.categoryId}))
  },
  /** group YouTube results for one song into "sources" instead of separate results */
  async sourcesFor(track){const r=await this.search(`${track.artist.split(/,|&/)[0]} ${track.title.replace(/\(.*?\)/g,'')}`,{max:12,music:true});const bt=baseTitle(track.title);
    const kind=t=>/official (music )?video|\(official\)/i.test(t)?'Official video':/official audio|\baudio\b|topic/i.test(t)?'Audio':/lyric/i.test(t)?'Lyric video':/\blive\b/i.test(t)?'Live':/visuali[sz]er/i.test(t)?'Visualizer':/sped|slowed|nightcore|reverb/i.test(t)?'Edit':'Video';
    return r.filter(v=>baseTitle(v.title).includes(bt.split(' ').slice(0,3).join(' '))||v.title.toLowerCase().includes(bt)).map(v=>({...v,kind:kind(v.title+' '+v.artist)}))},
  parseId(s){const m=String(s).match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/)||String(s).match(/^([\w-]{11})$/);return m?m[1]:null},
  async oembed(id){if(window.SSrc){const v=await SSrc.Video.info(id);if(v)return v}try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));return await r.json()}catch(e){return null}},
};
function isoDur(s){const m=String(s).match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/)||[];return(+m[1]||0)*86400+(+m[2]||0)*3600+(+m[3]||0)*60+(+m[4]||0)}

window.SData={Health,placeholderArt,localLibrary,Store,IDB,API,Radio,Pod,YT,jsonp,itunes,toTrack,groupVersions,versionTags,baseTitle,artistKey,profile,vault,hookRank,collaborators,VIRAL_SEED,cachedIds,LS};
})();

<script>
/* sniplit sources — every free, keyless music service worth having, queried together and merged.
   Each call fails soft (returns empty) so any service can disappear without the app noticing. */
(function(){
const{jsonp,toTrack,baseTitle,artistKey}=SData;
const MEM=new Map();
const ckey=u=>'sn.x:'+SFile.crc32(new TextEncoder().encode(u)).toString(36);
async function get(url,{ttl=216e5,type='json',timeout=9000,headers}={}){
  if(MEM.has(url))return MEM.get(url);
  try{const hit=JSON.parse(localStorage.getItem(ckey(url))||'null');if(hit&&Date.now()-hit.at<ttl){MEM.set(url,Promise.resolve(hit.v));return hit.v}}catch(e){}
  const H=SData.Health;if(!H.up(url))return Promise.reject(new Error('resting'));
  const p=(async()=>{const ac=new AbortController();const t=setTimeout(()=>ac.abort(),timeout);try{let r;try{r=await fetch(url,{signal:ac.signal,headers})}catch(e){H.bad(url);throw e}if(!r.ok){if(r.status>=500||r.status===403||r.status===429)H.bad(url);throw new Error(r.status)}H.ok(url);const v=type==='json'?await r.json():await r.text();
    try{const s=JSON.stringify({at:Date.now(),v});if(s.length<180000)localStorage.setItem(ckey(url),s)}catch(e){}return v}finally{clearTimeout(t)}})();
  MEM.set(url,p);p.catch(()=>MEM.delete(url));return p}
const soft=async(f,d=[])=>{try{const v=await f();return v??d}catch(e){return d}};
let mbLast=0;const mbWait=async()=>{const w=mbLast+1100-Date.now();mbLast=Math.max(Date.now(),mbLast+1100);if(w>0)await new Promise(r=>setTimeout(r,w))};
const enc=encodeURIComponent;

/* ---------- Deezer (JSONP) : catalog, previews, charts, related artists ---------- */
const dz=(path,ttl)=>{const u='https://api.deezer.com/'+path+(path.includes('?')?'&':'?')+'output=jsonp';const m=MEM.get(u);if(m)return m;const p=jsonp(u,8000);MEM.set(u,p);p.catch(()=>MEM.delete(u));return p};
const dzTrack=x=>({id:'dz:'+x.id,src:'deezer',dzId:x.id,title:x.title_short&&x.title_version?`${x.title_short} ${x.title_version}`:x.title,artist:x.artist&&x.artist.name,artistDz:x.artist&&x.artist.id,album:x.album&&x.album.title,
  art:(x.album&&(x.album.cover_xl||x.album.cover_big))||'',preview:x.preview||null,durationMs:(x.duration||0)*1000,explicit:!!x.explicit_lyrics,genre:'',isrc:x.isrc||null,url:x.link});
const Deezer={
  search:(q,limit=25)=>soft(async()=>(await dz(`search?q=${enc(q)}&limit=${limit}`)).data.map(dzTrack)),
  chart:(limit=50)=>soft(async()=>(await dz(`chart/0/tracks?limit=${limit}`)).data.map(dzTrack)),
  artist:name=>soft(async()=>((await dz(`search/artist?q=${enc(name)}&limit=1`)).data||[])[0]||null,null),
  related:id=>soft(async()=>(await dz(`artist/${id}/related?limit=20`)).data.map(a=>({name:a.name,dzId:a.id,art:a.picture_xl||a.picture_big,fans:a.nb_fan}))),
  top:id=>soft(async()=>(await dz(`artist/${id}/top?limit=50`)).data.map(dzTrack)),
  track:id=>soft(async()=>dzTrack(await dz(`track/${id}`)),null)};

/* ---------- Audius : full-length independent music, trending ---------- */
let auHost=null;const au=async path=>{if(!auHost){const d=await get('https://api.audius.co',{ttl:36e5});const hs=d.data||[];auHost=hs[Math.floor(Math.random()*hs.length)]}return get(`${auHost}/v1/${path}${path.includes('?')?'&':'?'}app_name=sniplit`,{ttl:18e5})};
const auTrack=x=>({id:'au:'+x.id,src:'audius',auId:x.id,title:x.title,artist:x.user&&x.user.name,album:'',art:x.artwork&&(x.artwork['1000x1000']||x.artwork['480x480'])||'',stream:null,durationMs:(x.duration||0)*1000,genre:x.genre||'',full:true,plays:x.play_count});
const Audius={
  trending:(genre='')=>soft(async()=>(await au(`tracks/trending?time=week${genre?'&genre='+enc(genre):''}`)).data.slice(0,30).map(auTrack)),
  search:q=>soft(async()=>(await au(`tracks/search?query=${enc(q)}`)).data.slice(0,20).map(auTrack)),
  async streamUrl(id){if(!auHost)await soft(()=>au('tracks/trending'));return auHost?`${auHost}/v1/tracks/${id}/stream?app_name=sniplit`:null}};

/* ---------- Internet Archive : live recordings & public-domain audio ---------- */
const IA={
  shows:artist=>soft(async()=>{const q=`creator:("${artist.replace(/"/g,'')}") AND mediatype:(etree OR audio)`;const d=await get(`https://archive.org/advancedsearch.php?q=${enc(q)}&fl[]=identifier&fl[]=title&fl[]=date&fl[]=creator&fl[]=downloads&sort[]=downloads+desc&rows=24&output=json`);
    return(d.response.docs||[]).map(x=>({id:'ia:'+x.identifier,ident:x.identifier,title:x.title,artist:Array.isArray(x.creator)?x.creator[0]:x.creator,date:(x.date||'').slice(0,10),art:`https://archive.org/services/img/${x.identifier}`,kind:'iashow'}))}),
  tracks:ident=>soft(async()=>{const d=await get(`https://archive.org/metadata/${enc(ident)}`,{ttl:864e5});const md=d.metadata||{};
    return(d.files||[]).filter(f=>/VBR MP3|MP3/i.test(f.format||'')&&!/_64kb/i.test(f.name)).map((f,i)=>({id:'ia:'+ident+':'+i,src:'archive',title:f.title||f.name.replace(/\.mp3$/i,''),artist:Array.isArray(md.creator)?md.creator[0]:md.creator,album:md.title,art:`https://archive.org/services/img/${ident}`,stream:`https://archive.org/download/${enc(ident)}/${f.name.split('/').map(enc).join('/')}`,durationMs:f.length?parseLen(f.length)*1000:0,full:true,genre:'Live'}))})};
function parseLen(s){if(!s)return 0;if(String(s).includes(':')){return String(s).split(':').reduce((a,b)=>a*60+(+b),0)}return+s}

/* ---------- MusicBrainz + Cover Art Archive : credits, first release, ISRCs ---------- */
const MB={
  async recording(t){return soft(async()=>{await mbWait();const q=`recording:"${baseTitle(t.title)}" AND artist:"${artistKey(t.artist)}"`;const d=await get(`https://musicbrainz.org/ws/2/recording?query=${enc(q)}&fmt=json&limit=5`,{ttl:864e5*7});
    const r=(d.recordings||[]).sort((a,b)=>(b.score||0)-(a.score||0))[0];if(!r)return null;
    return{mbid:r.id,first:r['first-release-date']||'',isrc:(r.isrcs||[])[0]||t.isrc||'',releases:(r.releases||[]).length,release:(r.releases||[])[0]&&(r.releases||[])[0].title,releaseId:(r.releases||[])[0]&&(r.releases||[])[0].id,length:r.length,tags:(r.tags||[]).map(x=>x.name).slice(0,5)}},null)},
  async artist(name){return soft(async()=>{await mbWait();const d=await get(`https://musicbrainz.org/ws/2/artist?query=${enc('artist:"'+name+'"')}&fmt=json&limit=1`,{ttl:864e5*7});const a=(d.artists||[])[0];if(!a)return null;
    return{mbid:a.id,country:a.country||(a.area&&a.area.name)||'',type:a.type||'',begin:a['life-span']&&a['life-span'].begin||'',tags:(a.tags||[]).sort((x,y)=>y.count-x.count).map(x=>x.name).slice(0,6)}},null)},
  cover:releaseId=>releaseId?`https://coverartarchive.org/release/${releaseId}/front-500`:''};

/* ---------- ListenBrainz : listener-based similar artists ---------- */
const LB={similar:mbid=>soft(async()=>{const d=await get(`https://labs.api.listenbrainz.org/similar-artists/json?artist_mbids=${mbid}&algorithm=session_based_days_7500_session_300_contribution_5_threshold_10_limit_100_filter_True_skip_30`,{ttl:864e5*3});
  const arr=Array.isArray(d)?d.flatMap(x=>x.data||x):[];return arr.filter(x=>x&&x.name).slice(0,20).map(x=>({name:x.name,mbid:x.artist_mbid,score:x.score}))})};

/* ---------- Wikipedia + TheAudioDB : bios & real artist photography ---------- */
const Wiki={summary:name=>soft(async()=>{for(const t of[name,name+' (musician)',name+' (band)',name+' (singer)',name+' (rapper)']){try{const d=await get(`https://en.wikipedia.org/api/rest_v1/page/summary/${enc(t.replace(/ /g,'_'))}`,{ttl:864e5*7});
  if(d.type==='standard'&&/(sing|rapp|band|music|songwrit|producer|DJ|group|duo|composer)/i.test((d.description||'')+' '+(d.extract||'').slice(0,300)))return{bio:d.extract,image:(d.originalimage||d.thumbnail||{}).source||'',url:d.content_urls&&d.content_urls.desktop.page}}catch(e){}}return null},null)};
const ADB={artist:name=>soft(async()=>{const d=await get(`https://www.theaudiodb.com/api/v1/json/2/search.php?s=${enc(name)}`,{ttl:864e5*7});const a=(d.artists||[])[0];if(!a)return null;
  return{bio:a.strBiographyEN||'',thumb:a.strArtistThumb||'',fanart:a.strArtistFanart||a.strArtistFanart2||'',banner:a.strArtistBanner||'',style:a.strStyle||'',mood:a.strMood||'',formed:a.intFormedYear||a.intBornYear||'',country:a.strCountry||'',site:a.strWebsite||''}},null)};

/* ---------- Bandsintown : upcoming shows ---------- */
const Tour={events:name=>soft(async()=>(await get(`https://rest.bandsintown.com/artists/${enc(name)}/events?app_id=sniplit&date=upcoming`,{ttl:432e5})).slice(0,12).map(e=>({when:e.datetime,venue:e.venue&&e.venue.name,city:[e.venue&&e.venue.city,e.venue&&e.venue.country].filter(Boolean).join(', '),url:e.url||(e.offers&&e.offers[0]&&e.offers[0].url)})))};

/* ---------- lyrics: every free source, several spellings each; candidates are cross-checked before one is chosen ---------- */
const norm=x=>String(x||'').toLowerCase().replace(/\$/g,'s').normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)|\[.*?\]|\b(feat|ft|with)\b\.?.*$/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const toks=x=>norm(x).split(' ').filter(Boolean);
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function sim(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;if(a===b)return 1;if(a.includes(b)||b.includes(a))return .9;const ta=new Set(a.split(' ')),tb=b.split(' ');let hit=0;for(const t of tb)if(ta.has(t)||[...ta].some(x=>x.length>3&&lev(x,t)<=1))hit++;
  const j=hit/Math.max(ta.size,tb.length);return Math.max(j,1-lev(a,b)/Math.max(a.length,b.length))}
const near=(a,b)=>sim(a,b)>=.6;
const lrcEnd=l=>{const m=[...String(l).matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];return m.length?(+m[m.length-1][1])*60+(+m[m.length-1][2]):0};
const goodLRC=(l,dur)=>!!l&&/\[\d+:\d+/.test(l)&&(!dur||lrcEnd(l)<dur+12)&&l.split('\n').filter(x=>/\]\s*\S/.test(x)).length>=4;
const plainOf=l=>String(l||'').replace(/\[[^\]]*\]/g,'').replace(/^\s*(\[.*?\]|\(.*?\))\s*$/gm,'').trim();
/** spellings to try: as written, without (feat./remaster/…), main artist only, $→s, punctuation stripped */
function variants(track){const T=new Set(),A=new Set();const t=String(track.title||''),a=String(track.artist||'');
  [t,baseTitle(t),t.replace(/\s+-\s+.*$/,''),t.replace(/\(.*?\)|\[.*?\]/g,''),norm(t)].forEach(x=>{x=x.trim();if(x)T.add(x)});
  const main=a.split(/,|&|\bfeat\.?|\bft\.?|\bx\b|\bwith\b/i)[0].trim();[a,main,artistKey(a),main.replace(/\$/g,'s'),norm(main),main.replace(/[^\w\s]/g,'')].forEach(x=>{x=String(x||'').trim();if(x)A.add(x)});
  return{titles:[...T].slice(0,4),artists:[...A].slice(0,4)}}
const LyrSrc={
  // LRCLIB search answers in one request with every version it has (no 404s, unlike /get)
  async lrclib(v,dur){const out=[];const add=r=>{if(r&&(r.syncedLyrics||r.plainLyrics))out.push({src:'lrclib',title:r.trackName,artist:r.artistName,dur:r.duration,lrc:goodLRC(r.syncedLyrics,dur)?r.syncedLyrics:null,plain:r.plainLyrics||plainOf(r.syncedLyrics),instrumental:!!r.instrumental})};
    const tries=[{track_name:v.titles[1]||v.titles[0],artist_name:v.artists[1]||v.artists[0]},{q:`${norm(v.artists[1]||v.artists[0])} ${norm(v.titles[1]||v.titles[0])}`},{track_name:norm(v.titles[0])}];
    for(const q of tries){const arr=await get('https://lrclib.net/api/search?'+new URLSearchParams(q),{ttl:864e5*7,timeout:6000}).catch(()=>[]);(arr||[]).slice(0,10).forEach(add);if(out.some(c=>c.lrc&&sim(c.title,v.titles[0])>.7&&sim(c.artist,v.artists[0])>.5))break}
    return out},
  async ovh(v){for(const a of v.artists.slice(1,3))for(const t of v.titles.slice(1,2)){const d=await get(`https://api.lyrics.ovh/v1/${enc(a)}/${enc(t)}`,{ttl:864e5*7,timeout:5000}).catch(()=>null);if(d&&d.lyrics)return[{src:'lyrics.ovh',title:t,artist:a,plain:d.lyrics.replace(/^Paroles de la chanson.*\n/,'')}]}return[]}};
const LYR_ORDER=['lrclib','ovh'];
const grams=(text,n=3)=>{const w=toks(text);const g=new Set();for(let i=0;i+n<=w.length;i++)g.add(w.slice(i,i+n).join(' '));return g};
function overlap(a,b){if(!a.size||!b.size)return 0;let h=0;for(const x of a)if(b.has(x))h++;return h/Math.min(a.size,b.size)}

const lyrMem=new Map();
/** gather candidates from every source (each tries several spellings), then pick the best-verified one */
async function bestLyrics(track,{heard}={}){const key=norm(track.artist)+'|'+norm(track.title);let cands=lyrMem.get(key);
  if(!cands){const v=variants(track),dur=(track.durationMs||0)/1000;cands=await LyrSrc.lrclib(v,dur).catch(()=>[]);

const Lyr2={plain:(artist,title)=>soft(async()=>{const r=await LyrSrc.ovh(variants({artist,title}));return r[0]&&r[0].plain},null),best:bestLyrics,rank,variants,sources:LyrSrc};

const Links={of:t=>soft(async()=>{const src=t.url||(t.dzId?`https://www.deezer.com/track/${t.dzId}`:'');if(!src)return null;const d=await get(`https://api.song.link/v1-alpha.1/links?url=${enc(src)}&userCountry=US`,{ttl:864e5*7});

/* ---------- Piped / Invidious : keyless video search (plays through YouTube's own player) ---------- */
const PIPED=['https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de','https://api.piped.private.coffee','https://pipedapi.r4fo.com','https://pipedapi.leptons.xyz'];
const INV=['https://inv.nadeko.net','https://invidious.nerdvpn.de','https://yewtu.be','https://invidious.f5.si'];

const BLOCK=/\b(gameplay|let'?s play|walkthrough|speedrun|fortnite|minecraft|roblox|valorant|gta|call of duty|twitch|live ?stream|stream highlights|irl stream)\b/i;
const ytItem=(id,title,author,secs)=>({id:'yt:'+id,src:'youtube',ytId:id,title,artist:(author||'').replace(/ - Topic$/,''),album:'Video',art:`https://i.ytimg.com/vi/${id}/hqdefault.jpg`,durationMs:(secs||0)*1000,genre:'Video'});

<script>
/* sniplit — local file/folder import, platform importers, linked accounts, identity export */
(function(){
const{Store,IDB,API,jsonp}=SData;
const AUDIO_RE=/\.(mp3|m4a|aac|wav|flac|ogg|oga|opus|webm|aif|aiff|alac|wma|mp4|caf)$/i;

/* ---------- ID3v2 / MP4 tag sniffing (title, artist, album, cover) ---------- */
async function readTags(file){
  const out={title:null,artist:null,album:null,art:null};
  try{const head=new Uint8Array(await file.slice(0,Math.min(file.size,512*1024)).arrayBuffer());
    if(head[0]===0x49&&head[1]===0x44&&head[2]===0x33){const ver=head[3];const size=(head[6]<<21)|(head[7]<<14)|(head[8]<<7)|head[9];let p=10;
      const dec=(b,enc)=>{try{return new TextDecoder(enc===1?'utf-16':enc===2?'utf-16be':enc===3?'utf-8':'latin1').decode(b).replace(/\0/g,'').trim()}catch(e){return''}};
      while(p<size&&p<head.length-10){const id=String.fromCharCode(...head.slice(p,p+4));if(!/^[A-Z0-9]{4}$/.test(id))break;
        const fs=ver===4?(head[p+4]<<21)|(head[p+5]<<14)|(head[p+6]<<7)|head[p+7]:(head[p+4]<<24)|(head[p+5]<<16)|(head[p+6]<<8)|head[p+7];const body=head.slice(p+10,p+10+fs);
        if(id==='TIT2')out.title=dec(body.slice(1),body[0]);if(id==='TPE1')out.artist=dec(body.slice(1),body[0]);if(id==='TALB')out.album=dec(body.slice(1),body[0]);
        if(id==='APIC'&&!out.art){let i=1;while(body[i])i++;const mime=dec(body.slice(1,i),0)||'image/jpeg';i+=2;const enc=body[0];if(enc===1||enc===2){while(i<body.length-1&&!(body[i]===0&&body[i+1]===0))i+=2;i+=2}else{while(body[i])i++;i++}
          out.art=URL.createObjectURL(new Blob([body.slice(i)],{type:mime}))}
        p+=10+fs}}
  }catch(e){}
  if(!out.title){const n=file.name.replace(AUDIO_RE,'').replace(/^\d+[\s._-]+/,'');const m=n.split(/\s+[-–]\s+/);if(m.length>1){out.artist=out.artist||m[0];out.title=m.slice(1).join(' - ')}else out.title=n}
  return out;
}
/** Import File[] (from <input webkitdirectory>, multi-select, or drag-drop recursion). */
async function importFiles(files,onProg){
  const list=[...files].filter(f=>AUDIO_RE.test(f.name)||(f.type||'').startsWith('audio/'));const added=[];let i=0;
  for(const f of list){const tags=await readTags(f);const id='lf:'+SFile.crc32(new TextEncoder().encode((f.webkitRelativePath||f.name)+f.size)).toString(36);
    const folder=(f.webkitRelativePath||f._path||'').split('/').slice(0,-1).join('/')||'Imported';
    let artData=null;if(tags.art){try{const b=await(await fetch(tags.art)).blob();artData=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});if(artData.length>400000)artData=null}catch(e){}}
    const t={id,src:'local',title:tags.title,artist:tags.artist||'Unknown artist',album:tags.album||folder.split('/').pop(),art:artData||API.demoArt(tags.title||f.name,''),durationMs:0,genre:'Local',folder,fileName:f.name,size:f.size};
    try{await IDB.put('files',id,{blob:f,meta:t})}catch(e){}
    if(!Store.imports.some(x=>x.id===id))Store.imports.push(t);added.push(t);onProg&&onProg(++i/list.length,t)}
  Store.save('imports');return added;
}
/** Walk dropped folders recursively (DataTransferItem.webkitGetAsEntry). */
async function filesFromDrop(dt){
  const out=[];const walk=async(entry,path)=>{if(entry.isFile){await new Promise(r=>entry.file(f=>{f._path=path+f.name;out.push(f);r()},r))}
    else if(entry.isDirectory){const rd=entry.createReader();let batch;do{batch=await new Promise(r=>rd.readEntries(r,()=>r([])));for(const e of batch)await walk(e,path+entry.name+'/')}while(batch.length)}};
  const items=[...(dt.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(items.length){for(const e of items)await walk(e,'')}else out.push(...dt.files);return out;
}

/* ---------- normalised import model ---------- */
// {source, likes:[{artist,title,album}], playlists:[{name,items:[{artist,title}]}], history:[{artist,title,ms,at}]}
function csvParse(txt){const rows=[];let row=[],f='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}
  const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]])))}
function pick(o,...ks){for(const k of ks){for(const kk of Object.keys(o)){if(kk.toLowerCase()===k.toLowerCase()&&o[kk])return String(o[kk])}}return''}
function parsePlist(xml){const doc=new DOMParser().parseFromString(xml,'text/xml');const val=n=>{if(!n)return null;switch(n.tagName){case'dict':{const o={};const c=[...n.children];for(let i=0;i<c.length;i+=2)o[c[i].textContent]=val(c[i+1]);return o}case'array':return[...n.children].map(val);case'integer':case'real':return+n.textContent;case'true':return true;case'false':return false;default:return n.textContent}};return val(doc.querySelector('plist>dict'))}

/** Detect and parse any supported export file. */
async function parseExport(file){
  const name=file.name.toLowerCase(),txt=await file.text();const out={source:'File',likes:[],playlists:[],history:[]};
  if(name.endsWith('.xml')&&txt.includes('<plist')){ // iTunes / Music Library.xml
    const p=parsePlist(txt);out.source='Apple Music / iTunes library';const tr=p.Tracks||{};const byId={};
    for(const t of Object.values(tr)){if(!t.Name)continue;const it={artist:t.Artist||'',title:t.Name,album:t.Album||''};byId[t['Track ID']]=it;if(t.Loved||t.Favorited||(t.Rating||0)>=80)out.likes.push(it);if(t['Play Count'])out.history.push({...it,ms:(t['Total Time']||0)*(t['Play Count']||1),at:t['Play Date UTC']})}
    for(const pl of p.Playlists||[]){if(pl.Master||pl['Distinguished Kind']||!pl['Playlist Items'])continue;out.playlists.push({name:pl.Name,items:pl['Playlist Items'].map(x=>byId[x['Track ID']]).filter(Boolean)})}
    return out}
  if(name.endsWith('.json')){let d;try{d=JSON.parse(txt)}catch(e){throw new Error('Unreadable JSON')}
    if(d&&d.format==='sniplit-identity')return{identity:d};

/** Resolve normalised import against the catalog; unmatched items are kept as "pending" and retried later. */

    if(t===undefined){if(it.ytId&&!it.title){const o=await SData.YT.oembed(it.ytId);t={id:'yt:'+it.ytId,src:'youtube',ytId:it.ytId,title:o?.title||it.ytId,artist:o?.author_name||'YouTube',album:'YouTube',art:o?.thumbnail_url||'',genre:'Video',durationMs:0}}
      else t=await API.resolve(it.artist,it.title);memo.set(k,t)}
    if(t){matched++;if(it._k==='like')Store.likes[t.id]={...t,likedAt:Date.now()};if(it._k==='pl'&&!pls[it._p].tracks.some(x=>x.id===t.id))pls[it._p].tracks.push(t);
      if(it._k==='hist')Store.history.push({track:t,at:Date.parse(it.at)||Date.now(),ms:it.ms||30000,full:(it.ms||0)>60000,imported:true})}

}

<script>
/* sniplit social — accountless friends over end-to-end-encrypted signaling + WebRTC data channels.
   • Identity: random id + inbox key, kept on device. Your friend link carries both.
   • Signaling/mailbox: MQTT over WebSocket (public brokers or your own); every payload is AES-GCM encrypted,
     topics are hashes, so brokers only ever see opaque bytes.
   • Live: once both friends are online a WebRTC data channel opens and presence, now-playing, stories and
     playlists flow peer-to-peer. Retained encrypted presence lets friends see "last active" while you're away. */
(function(){
const{Store,LS}=SData;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64u=u8=>btoa(String.fromCharCode(...u8)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
const hex=u8=>[...u8].map(b=>b.toString(16).padStart(2,'0')).join('');
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function sha(s){return hex(new Uint8Array(await crypto.subtle.digest('SHA-256',typeof s==='string'?enc.encode(s):s))).slice(0,24)}
const keyCache=new Map();
async function aesKey(raw){const k=typeof raw==='string'?raw:b64u(raw);if(!keyCache.has(k))keyCache.set(k,await crypto.subtle.importKey('raw',typeof raw==='string'?ub64u(raw):raw,'AES-GCM',false,['encrypt','decrypt']));return keyCache.get(k)}
async function seal(keyB64,obj){const iv=rnd(12);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(keyB64),enc.encode(JSON.stringify(obj))));const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return out}
async function open(keyB64,u8){try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8.slice(0,12)},await aesKey(keyB64),u8.slice(12));return JSON.parse(dec.decode(pt))}catch(e){return null}}

/* ---------------- minimal MQTT 3.1.1 client over WebSocket ---------------- */
class MQTT{
  constructor(urls,onMsg,onState){this.urls=urls;this.onMsg=onMsg;this.onState=onState||(()=>{});this.subs=new Set();this.buf=new Uint8Array(0);this.ui=0;this.pid=1;this.up=false;this.queue=[]}
  connect(){const url=this.urls[this.ui%this.urls.length];let ws;try{ws=new WebSocket(url,'mqtt')}catch(e){return this.retry()}
    ws.binaryType='arraybuffer';this.ws=ws;
    ws.onopen=()=>{const cid=enc.encode('sn'+hex(rnd(8)));const vh=[0,4,77,81,84,84,4,2,0,60];this.raw(0x10,[...vh,cid.length>>8,cid.length&255,...cid])};
    ws.onmessage=e=>this.feed(new Uint8Array(e.data));
    ws.onclose=()=>{this.up=false;this.onState(false,url);clearInterval(this.ping);this.retry()};ws.onerror=()=>{try{ws.close()}catch(e){}}}
  retry(){clearTimeout(this.rt);this.ui++;this.rt=setTimeout(()=>this.connect(),Math.min(30000,1500*Math.max(1,this.ui)))}
  raw(type,body){const len=[];let n=body.length;do{let b=n%128;n=Math.floor(n/128);if(n>0)b|=128;len.push(b)}while(n>0);const pkt=new Uint8Array(1+len.length+body.length);pkt[0]=type;pkt.set(len,1);pkt.set(body,1+len.length);if(this.ws&&this.ws.readyState===1)this.ws.send(pkt)}
  str(s){const b=enc.encode(s);return[b.length>>8,b.length&255,...b]}
  subscribe(topic){this.subs.add(topic);if(this.up){const id=this.pid++&0xffff||1;this.raw(0x82,[id>>8,id&255,...this.str(topic),0])}}
  unsubscribe(topic){this.subs.delete(topic);if(this.up){const id=this.pid++&0xffff||1;this.raw(0xA2,[id>>8,id&255,...this.str(topic)])}}
  publish(topic,payload,retain=false){if(!this.up){this.queue.push([topic,payload,retain]);return}const p=payload instanceof Uint8Array?payload:enc.encode(payload);this.raw(0x30|(retain?1:0),[...this.str(topic),...p])}
  feed(chunk){const b=new Uint8Array(this.buf.length+chunk.length);b.set(this.buf);b.set(chunk,this.buf.length);this.buf=b;
    for(;;){if(this.buf.length<2)return;let mul=1,len=0,i=1,byte;do{if(i>=this.buf.length)return;byte=this.buf[i++];len+=(byte&127)*mul;mul*=128}while(byte&128);
      if(this.buf.length<i+len)return;const type=this.buf[0]>>4,flags=this.buf[0]&15,body=this.buf.slice(i,i+len);this.buf=this.buf.slice(i+len);this.handle(type,flags,body)}}
  handle(type,flags,body){
    if(type===2){if(body[1]!==0){this.ws.close();return}this.up=true;this.ui=0;this.onState(true);for(const t of this.subs){const id=this.pid++&0xffff||1;this.raw(0x82,[id>>8,id&255,...this.str(t),0])}
      const q=this.queue.splice(0);q.forEach(a=>this.publish(...a));clearInterval(this.ping);this.ping=setInterval(()=>this.raw(0xC0,[]),30000)}
    if(type===3){const tl=(body[0]<<8)|body[1];const topic=dec.decode(body.slice(2,2+tl));let p=2+tl;if((flags>>1)&3)p+=2;this.onMsg(topic,body.slice(p))}}
}

/* ---------------- social state ---------------- */

let mq=null,online=false,myTopicHash=null;const peers={};// friendId -> {pc,dc,state}
const T={mb:(ph,ih)=>`sniplit/v1/p/${ph}/mb/${ih}`,inbox:h=>`sniplit/v1/i/${h}`,pres:(ph,ih)=>`sniplit/v1/p/${ph}/pr/${ih}`,sig:(ph,ih)=>`sniplit/v1/p/${ph}/sg/${ih}`};
const code=()=>b64u(new Uint8Array([...Uint8Array.from(S.id.match(/../g),h=>parseInt(h,16)),...ub64u(S.inbox)]));
function parseCode(c){c=String(c).trim().replace(/^.*#add-/,'');try{const u=ub64u(c);if(u.length!==24)return null;return{id:hex(u.slice(0,8)),inbox:b64u(u.slice(8))}}catch(e){return null}}
function link(){const base=location.origin.startsWith('http')?location.origin+location.pathname:'https://sniplit.app/index.html';return base+'#add-'+code()}

async function start(){
  if(mq)return;const brokers=(Store.settings.broker?[Store.settings.broker]:[]).concat(DEFAULT_BROKERS);
  mq=new MQTT(brokers,onMqtt,(up)=>{online=up;emit();if(up)announce()});
  myTopicHash=await sha(S.inbox);mq.subscribe(T.inbox(myTopicHash)+'/#');
  for(const f of Object.values(S.friends))await watchFriend(f);
  mq.subscribe(DIR+'+');mq.connect();

  document.addEventListener('visibilitychange',()=>{publishPresence();broadcast()});
  addEventListener('pagehide',()=>{S._leaving=true;publishPresence(true)});
}
async function watchFriend(f){f.ph=f.ph||await sha(f.pair);f.myh=f.myh||await sha(S.id+f.pair);f.th=f.th||await sha(f.id+f.pair);
  mq.subscribe(T.pres(f.ph,f.th));mq.subscribe(T.sig(f.ph,f.myh));mq.subscribe(T.mb(f.ph,f.myh)+'/#')}
/* ---- Find friends: an opt-in public listing (name, invite code, a few favourite artists — nothing else) ---- */
const DIR='sniplit/v1/dir/';const dir=new Map();let dirT=0;

  mq.publish(DIR+S.id,JSON.stringify({v:1,id:S.id,name:(S.name||'').slice(0,40),code:code(),artists:(ta.artists||[]).slice(0,8),genres:(ta.genres||[]).slice(0,4),now:S.share&&d.now?{title:d.now.title,artist:d.now.artist,art:d.now.art&&/^https:/.test(d.now.art)?d.now.art:''}:null,at:Date.now()}),true)}
function onDir(id,payload){if(id===S.id)return;if(!payload.length){dir.delete(id);return}try{const m=JSON.parse(dec.decode(payload));if(m.v!==1||m.id!==id||!parseCode(m.code)||Date.now()-m.at>14*864e5)return;
  dir.set(id,{id,name:String(m.name||'').slice(0,40),code:m.code,artists:(m.artists||[]).slice(0,8).map(String),genres:(m.genres||[]).slice(0,4).map(String),now:m.now&&m.now.title?m.now:null,at:+m.at});if(dir.size>800){const old=[...dir.values()].sort((a,b)=>a.at-b.at)[0];dir.delete(old.id)}
  clearTimeout(dirT);dirT=setTimeout(emit,400)}catch(e){}}
async function onMqtt(topic,payload){
  if(topic.startsWith(DIR)){onDir(topic.slice(DIR.length),payload);return}
  if(!payload.length)return;
  if(topic.startsWith(T.inbox(myTopicHash)+'/')){const m=await open(S.inbox,payload);if(!m)return;
    if(m.t==='req'){if(S.friends[m.from.id]){mq.publish(topic,new Uint8Array(0),true);return}S.inReq[m.from.id]={...m.from,pair:m.pair,at:m.at,topic};save();emit()}
    if(m.t==='acc'){const o=S.out[m.from.id];if(!o||o.pair!==m.pair)return;delete S.out[m.from.id];const f=S.friends[m.from.id]={id:m.from.id,name:m.from.name,pair:m.pair,since:Date.now()};mq.publish(topic,new Uint8Array(0),true);save();await watchFriend(f);publishPresence();hello(f);emit()}
    if(m.t==='dec'){delete S.out[m.from.id];mq.publish(topic,new Uint8Array(0),true);save();emit()}
    return}
  for(const f of Object.values(S.friends)){if(!f.ph)continue;
    if(topic===T.pres(f.ph,f.th)){const m=await open(f.pair,payload);if(!m)return;applyPresence(f,m);if(m.active&&Date.now()-m.at<120000&&!(peers[f.id]&&peers[f.id].dc&&peers[f.id].dc.readyState==='open'))hello(f);return}
    if(topic.startsWith(T.mb(f.ph,f.myh)+'/')){const m=await open(f.pair,payload);mq.publish(topic,new Uint8Array(0),true);if(m&&m.t==='track')gotTrack(f,m.track,m.at);return}
    if(topic===T.sig(f.ph,f.myh)){const m=await open(f.pair,payload);if(!m)return;onSignal(f,m);return}}
}
function applyPresence(f,m){if(m.removed){delete S.friends[f.id];save();emit();return}
  f.name=m.name||f.name;f.p={active:!!m.active,now:m.now||null,at:m.at,story:m.story||null,year:m.year||null,avatar:m.avatar||null};save();emit()}

/* ---------------- presence ---------------- */

/* ---------------- WebRTC ---------------- */
const ICE=[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']},{urls:'stun:stun.cloudflare.com:3478'}];

  dc.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.t==='presence'){applyPresence(f,m);f.p.live=true}

async function sendTrack(id,track){const f=S.friends[id];if(!f)return;const t={id:track.id,title:track.title,artist:track.artist,album:track.album,art:track.art&&!track.art.startsWith('data:')?track.art:'',preview:track.preview,durationMs:track.durationMs,artistId:track.artistId,src:track.src==='local'?'itunes':track.src,ytId:track.ytId};

  if(m.t==='hello'){if(S.id<f.id){const p=newPeer(f);bindDC(f,p.pc.createDataChannel('sniplit'));await p.pc.setLocalDescription(await p.pc.createOffer());await gather(p.pc);sig(f,{t:'offer',sdp:p.pc.localDescription.sdp})}else sig(f,{t:'hello2'})}

  if(m.t==='offer'){const p=newPeer(f);await p.pc.setRemoteDescription({type:'offer',sdp:m.sdp});await p.pc.setLocalDescription(await p.pc.createAnswer());await gather(p.pc);sig(f,{t:'answer',sdp:p.pc.localDescription.sdp})}
  if(m.t==='answer'){const p=peers[f.id];if(p&&p.pc.signalingState==='have-local-offer')await p.pc.setRemoteDescription({type:'answer',sdp:m.sdp})}
}
function send(f,m){const p=peers[f.id];if(p&&p.dc&&p.dc.readyState==='open'){try{p.dc.send(JSON.stringify(m))}catch(e){}}}
function sendPlaylists(f){if(!S.sharePlaylists)return send(f,{t:'playlists',list:[]});const d=provider();send(f,{t:'playlists',list:(d.playlists||[]).slice(0,40)})}
function broadcast(){const pr={t:'presence',...myPresence()};for(const f of Object.values(S.friends))send(f,pr)}

/* ---------------- friend actions ---------------- */
async function request(c){const t=parseCode(c);if(!t)throw new Error('That link or code isn’t valid');if(t.id===S.id)throw new Error('That’s your own link');if(S.friends[t.id])throw new Error('Already friends');
  const pair=b64u(rnd(32));S.out[t.id]={id:t.id,inbox:t.inbox,pair,at:Date.now()};save();
  const h=await sha(t.inbox);await start();mq.publish(T.inbox(h)+'/'+(await sha(S.id+t.id)),await seal(t.inbox,{t:'req',from:{id:S.id,name:S.name||'sniplit listener',code:code()},pair,at:Date.now()}),true);emit()}

function setOpt(k,v){S[k]=v;save();publishPresence();if(k==='discoverable'||k==='share')publishDir();broadcast();for(const f of Object.values(S.friends))sendPlaylists(f);emit()}

window.SSocial={directory:()=>[...dir.values()].filter(x=>!S.friends[x.id]&&!S.out[x.id]&&!S.inReq[x.id]),sendTrack,start,request,accept,decline,remove,cancel,requestPlaylists,setName,setOpt,link,code,parseCode,
  update(){publishPresence();broadcast()},setProvider(f){provider=f},on(f){listeners.add(f);return()=>listeners.delete(f)},

  const c=await IDB.get('audio',t.id);if(c&&c.blob)return{blob:c.blob,kind:'cached',full:!!c.full,fx:c.fx,lyrics:c.lyrics};
  if(t.src==='radio')return{url:t.stream,live:true,kind:'radio'};

  if(t.src==='audius'){const u=await SSrc.Audius.streamUrl(t.auId).catch(()=>null);if(u)return{url:u,kind:'full',full:true}}

      try{const s=await Promise.race([YT.sourcesFor(t),new Promise(r=>setTimeout(()=>r([]),c.length?1500:4000))]);const order=['Audio','Official video','Lyric video','Video','Visualizer'];
        s.sort((a,b)=>order.indexOf(a.kind)-order.indexOf(b.kind)).forEach(x=>{if(!c.includes(x.ytId)&&x.kind!=='Live'&&x.kind!=='Edit')c.push(x.ytId)});t.ytStillIds=s.filter(x=>x.kind==='Audio').map(x=>x.ytId)}catch(e){}

function mediaSessionState(){if(!('mediaSession'in navigator))return;navigator.mediaSession.playbackState=eng.playing?'playing':'paused';try{if(eng.duration&&isFinite(eng.duration))navigator.mediaSession.setPositionState({duration:eng.duration,position:Math.min(eng.time,eng.duration),playbackRate:eng.fx.rate})}catch(e){}}
let wakeLock=null;async function wake(){try{if(Store.settings.keepAwake&&eng.playing&&'wakeLock'in navigator&&!wakeLock&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}else if((!eng.playing||!Store.settings.keepAwake)&&wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}

  if(document.visibilityState==='hidden'&&eng.el===eng.fxEl&&/iP(hone|ad|od)/.test(navigator.userAgent)&&eng.playing&&!Store.settings.fxBackground){const saved={...eng.fx};eng.forceGraph=false;Object.assign(eng.fx,{...Engine.DEFAULT_FX,volume:saved.volume,rate:saved.rate});eng.route(true).then(()=>{Object.assign(eng.fx,saved);eng._pendingFx=true})}
  if(document.visibilityState==='visible'&&eng._pendingFx){eng._pendingFx=false;eng.setFx({})}});

  m.innerHTML=`<div class="prog"><i></i></div><div class="mi" data-act="np"><img src="${esc(cur.art||SData.placeholderArt(cur.title))}" alt=""><div class="grow"><div class="ell mt">${esc(cur.title)}</div><div class="ell mut small">${esc(cur.artist)}</div></div></div>
  <div class="ctr"><button class="icon-btn hide-m" data-act="shuffle" aria-label="Shuffle">${I('shuffle')}</button><button class="icon-btn hide-m" data-act="prev" data-lock aria-label="Previous">${I('prev')}</button><button class="pp" data-act="toggle" aria-label="Play or pause">${I(eng.playing?'pause':'play')}</button><button class="icon-btn" data-act="next" data-lock aria-label="Next">${I('next')}</button><button class="icon-btn hide-m" data-act="loop" aria-label="Repeat">${I('repeat')}</button></div>
