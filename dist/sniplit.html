}
/** Walk dropped folders recursively (DataTransferItem.webkitGetAsEntry). */
async function filesFromDrop(dt){
  const out=[];const walk=async(entry,path)=>{if(entry.isFile){await new Promise(r=>entry.file(f=>{f._path=path+f.name;out.push(f);r()},r))}
    else if(entry.isDirectory){const rd=entry.createReader();let batch;do{batch=await new Promise(r=>rd.readEntries(r,()=>r([])));for(const e of batch)await walk(e,path+entry.name+'/')}while(batch.length)}};
  const items=[...(dt.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(items.length){for(const e of items)await walk(e,'')}else out.push(...dt.files);return out;
}

/* ---------- normalised import model ---------- */
// {source, likes:[{artist,title,album}], playlists:[{name,items:[{artist,title}]}], history:[{artist,title,ms,at}]}
function csvParse(txt){const rows=[];let row=[],f='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}
  const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]])))}
function pick(o,...ks){for(const k of ks){for(const kk of Object.keys(o)){if(kk.toLowerCase()===k.toLowerCase()&&o[kk])return String(o[kk])}}return''}
function parsePlist(xml){const doc=new DOMParser().parseFromString(xml,'text/xml');const val=n=>{if(!n)return null;switch(n.tagName){case'dict':{const o={};const c=[...n.children];for(let i=0;i<c.length;i+=2)o[c[i].textContent]=val(c[i+1]);return o}case'array':return[...n.children].map(val);case'integer':case'real':return+n.textContent;case'true':return true;case'false':return false;default:return n.textContent}};return val(doc.querySelector('plist>dict'))}

/** Detect and parse any supported export file. */
async function parseExport(file){
  const name=file.name.toLowerCase(),txt=await file.text();const out={source:'File',likes:[],playlists:[],history:[]};
  if(name.endsWith('.xml')&&txt.includes('<plist')){ // iTunes / Music Library.xml
    const p=parsePlist(txt);out.source='Apple Music / iTunes library';const tr=p.Tracks||{};const byId={};
    for(const t of Object.values(tr)){if(!t.Name)continue;const it={artist:t.Artist||'',title:t.Name,album:t.Album||''};byId[t['Track ID']]=it;if(t.Loved||t.Favorited||(t.Rating||0)>=80)out.likes.push(it);if(t['Play Count'])out.history.push({...it,ms:(t['Total Time']||0)*(t['Play Count']||1),at:t['Play Date UTC']})}
    for(const pl of p.Playlists||[]){if(pl.Master||pl['Distinguished Kind']||!pl['Playlist Items'])continue;out.playlists.push({name:pl.Name,items:pl['Playlist Items'].map(x=>byId[x['Track ID']]).filter(Boolean)})}
    return out}
  if(name.endsWith('.json')){let d;try{d=JSON.parse(txt)}catch(e){throw new Error('Unreadable JSON')}
    if(d&&d.format==='sniplit-identity')return{identity:d};

/** Resolve normalised import against the catalog; unmatched items are kept as "pending" and retried later. */
async function applyImport(data,onProg){

    if(t===undefined){if(it.ytId&&!it.title){const o=await SData.YT.oembed(it.ytId);t={id:'yt:'+it.ytId,src:'youtube',ytId:it.ytId,title:o?.title||it.ytId,artist:o?.author_name||'YouTube',album:'YouTube',art:o?.thumbnail_url||'',genre:'Video',durationMs:0}}
      else t=await API.resolve(it.artist,it.title);memo.set(k,t)}
    if(t){matched++;if(it._k==='like')Store.likes[t.id]={...t,likedAt:Date.now()};if(it._k==='pl'&&!pls[it._p].tracks.some(x=>x.id===t.id))pls[it._p].tracks.push(t);
      if(it._k==='hist')Store.history.push({track:t,at:Date.parse(it.at)||Date.now(),ms:it.ms||30000,full:(it.ms||0)>60000,imported:true})}

}

<script>
/* sniplit social — accountless friends over end-to-end-encrypted signaling + WebRTC data channels.
   • Identity: random id + inbox key, kept on device. Your friend link carries both.
   • Signaling/mailbox: MQTT over WebSocket (public brokers or your own); every payload is AES-GCM encrypted,
     topics are hashes, so brokers only ever see opaque bytes.
   • Live: once both friends are online a WebRTC data channel opens and presence, now-playing, stories and
     playlists flow peer-to-peer. Retained encrypted presence lets friends see "last active" while you're away. */
(function(){
const{Store,LS}=SData;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64u=u8=>btoa(String.fromCharCode(...u8)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0));
const hex=u8=>[...u8].map(b=>b.toString(16).padStart(2,'0')).join('');
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function sha(s){return hex(new Uint8Array(await crypto.subtle.digest('SHA-256',typeof s==='string'?enc.encode(s):s))).slice(0,24)}
const keyCache=new Map();
async function aesKey(raw){const k=typeof raw==='string'?raw:b64u(raw);if(!keyCache.has(k))keyCache.set(k,await crypto.subtle.importKey('raw',typeof raw==='string'?ub64u(raw):raw,'AES-GCM',false,['encrypt','decrypt']));return keyCache.get(k)}
async function seal(keyB64,obj){const iv=rnd(12);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(keyB64),enc.encode(JSON.stringify(obj))));const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return out}
async function open(keyB64,u8){try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8.slice(0,12)},await aesKey(keyB64),u8.slice(12));return JSON.parse(dec.decode(pt))}catch(e){return null}}

/* ---------------- minimal MQTT 3.1.1 client over WebSocket ---------------- */
class MQTT{
  constructor(urls,onMsg,onState){this.urls=urls;this.onMsg=onMsg;this.onState=onState||(()=>{});this.subs=new Set();this.buf=new Uint8Array(0);this.ui=0;this.pid=1;this.up=false;this.queue=[]}
  connect(){const url=this.urls[this.ui%this.urls.length];let ws;try{ws=new WebSocket(url,'mqtt')}catch(e){return this.retry()}
    ws.binaryType='arraybuffer';this.ws=ws;
    ws.onopen=()=>{const cid=enc.encode('sn'+hex(rnd(8)));const vh=[0,4,77,81,84,84,4,2,0,60];this.raw(0x10,[...vh,cid.length>>8,cid.length&255,...cid])};
    ws.onmessage=e=>this.feed(new Uint8Array(e.data));
    ws.onclose=()=>{this.up=false;this.onState(false,url);clearInterval(this.ping);this.retry()};ws.onerror=()=>{try{ws.close()}catch(e){}}}
  retry(){clearTimeout(this.rt);this.ui++;this.rt=setTimeout(()=>this.connect(),Math.min(30000,1500*Math.max(1,this.ui)))}
  raw(type,body){const len=[];let n=body.length;do{let b=n%128;n=Math.floor(n/128);if(n>0)b|=128;len.push(b)}while(n>0);const pkt=new Uint8Array(1+len.length+body.length);pkt[0]=type;pkt.set(len,1);pkt.set(body,1+len.length);if(this.ws&&this.ws.readyState===1)this.ws.send(pkt)}
  str(s){const b=enc.encode(s);return[b.length>>8,b.length&255,...b]}
  subscribe(topic){this.subs.add(topic);if(this.up){const id=this.pid++&0xffff||1;this.raw(0x82,[id>>8,id&255,...this.str(topic),0])}}
  unsubscribe(topic){this.subs.delete(topic);if(this.up){const id=this.pid++&0xffff||1;this.raw(0xA2,[id>>8,id&255,...this.str(topic)])}}
  publish(topic,payload,retain=false){if(!this.up){this.queue.push([topic,payload,retain]);return}const p=payload instanceof Uint8Array?payload:enc.encode(payload);this.raw(0x30|(retain?1:0),[...this.str(topic),...p])}
  feed(chunk){const b=new Uint8Array(this.buf.length+chunk.length);b.set(this.buf);b.set(chunk,this.buf.length);this.buf=b;
    for(;;){if(this.buf.length<2)return;let mul=1,len=0,i=1,byte;do{if(i>=this.buf.length)return;byte=this.buf[i++];len+=(byte&127)*mul;mul*=128}while(byte&128);
      if(this.buf.length<i+len)return;const type=this.buf[0]>>4,flags=this.buf[0]&15,body=this.buf.slice(i,i+len);this.buf=this.buf.slice(i+len);this.handle(type,flags,body)}}
  handle(type,flags,body){
    if(type===2){if(body[1]!==0){this.ws.close();return}this.up=true;this.ui=0;this.onState(true);for(const t of this.subs){const id=this.pid++&0xffff||1;this.raw(0x82,[id>>8,id&255,...this.str(t),0])}
      const q=this.queue.splice(0);q.forEach(a=>this.publish(...a));clearInterval(this.ping);this.ping=setInterval(()=>this.raw(0xC0,[]),30000)}
    if(type===3){const tl=(body[0]<<8)|body[1];const topic=dec.decode(body.slice(2,2+tl));let p=2+tl;if((flags>>1)&3)p+=2;this.onMsg(topic,body.slice(p))}}
}

/* ---------------- social state ---------------- */
const S=LS.get('social',null)||{};

let mq=null,online=false,myTopicHash=null;const peers={};// friendId -> {pc,dc,state}
const T={mb:(ph,ih)=>`sniplit/v1/p/${ph}/mb/${ih}`,inbox:h=>`sniplit/v1/i/${h}`,pres:(ph,ih)=>`sniplit/v1/p/${ph}/pr/${ih}`,sig:(ph,ih)=>`sniplit/v1/p/${ph}/sg/${ih}`};
const code=()=>b64u(new Uint8Array([...Uint8Array.from(S.id.match(/../g),h=>parseInt(h,16)),...ub64u(S.inbox)]));

function link(){const base=/^https?:$/.test(location.protocol)&&!/^(localhost|127\.)/.test(location.hostname)?location.origin+location.pathname:(window.SNIPLIT_SITE||'https://ayqshi.github.io/sniplet/www/index.html');return base+'#add-'+code()}

async function start(){
  if(mq)return;const brokers=(Store.settings.broker?[Store.settings.broker]:[]).concat(DEFAULT_BROKERS);

  myTopicHash=await sha(S.inbox);mq.subscribe(T.inbox(myTopicHash)+'/#');

}
async function watchFriend(f){f.ph=f.ph||await sha(f.pair);f.myh=f.myh||await sha(S.id+f.pair);f.th=f.th||await sha(f.id+f.pair);
  mq.subscribe(T.pres(f.ph,f.th));mq.subscribe(T.sig(f.ph,f.myh));mq.subscribe(T.mb(f.ph,f.myh)+'/#')}

  mq.publish(DIR+S.id,JSON.stringify({v:1,id:S.id,name:(S.name||'').slice(0,40),code:code(),artists:(ta.artists||[]).slice(0,8),genres:(ta.genres||[]).slice(0,4),now:S.share&&d.now?{title:d.now.title,artist:d.now.artist,art:d.now.art&&/^https:/.test(d.now.art)?d.now.art:''}:null,at:Date.now()}),true)}

  clearTimeout(dirT);dirT=setTimeout(emit,400)}catch(e){}}
async function onMqtt(topic,payload){
  if(topic.startsWith(DIR)){onDir(topic.slice(DIR.length),payload);return}
  if(!payload.length)return;
  if(topic.startsWith(T.inbox(myTopicHash)+'/')){const m=await open(S.inbox,payload);if(!m)return;
    if(m.t==='req'){if(S.friends[m.from.id]){mq.publish(topic,new Uint8Array(0),true);return}S.inReq[m.from.id]={...m.from,pair:m.pair,at:m.at,topic};save();emit()}
    if(m.t==='acc'){const o=S.out[m.from.id];if(!o||o.pair!==m.pair)return;delete S.out[m.from.id];const f=S.friends[m.from.id]={id:m.from.id,name:m.from.name,pair:m.pair,since:Date.now()};mq.publish(topic,new Uint8Array(0),true);save();await watchFriend(f);publishPresence();hello(f);emit()}
    if(m.t==='dec'){delete S.out[m.from.id];mq.publish(topic,new Uint8Array(0),true);save();emit()}
    return}
  for(const f of Object.values(S.friends)){if(!f.ph)continue;
    if(topic===T.pres(f.ph,f.th)){const m=await open(f.pair,payload);if(!m)return;applyPresence(f,m);if(m.active&&Date.now()-m.at<120000&&!(peers[f.id]&&peers[f.id].dc&&peers[f.id].dc.readyState==='open'))hello(f);return}

}

  f.name=m.name||f.name;f.p={active:!!m.active,now:m.now||null,at:m.at,story:m.story||null,year:m.year||null,avatar:m.avatar||null};save();emit()}

/* ---------------- WebRTC ---------------- */

/* ---------------- friend actions ---------------- */
async function request(c){const t=parseCode(c);if(!t)throw new Error('That link or code isn’t valid');if(t.id===S.id)throw new Error('That’s your own link');if(S.friends[t.id])throw new Error('Already friends');

  const h=await sha(t.inbox);await start();mq.publish(T.inbox(h)+'/'+(await sha(S.id+t.id)),await seal(t.inbox,{t:'req',from:{id:S.id,name:S.name||'sniplit listener',code:code()},pair,at:Date.now()}),true);emit()}

window.SSocial={directory:()=>[...dir.values()].filter(x=>!S.friends[x.id]&&!S.out[x.id]&&!S.inReq[x.id]),sendTrack,start,request,accept,decline,remove,cancel,requestPlaylists,setName,setOpt,link,code,parseCode,

async function toWav(blob){try{const AC=window.OfflineAudioContext||window.webkitOfflineAudioContext;const buf=await new AC(2,44100,44100).decodeAudioData(await blob.arrayBuffer());return{wav:SFile.encodeWAV(buf,16),dur:buf.duration}}catch(e){return null}}
async function cacheTrack(t,btn){if(!t)return false;if(cachedIds.has(t.id))return true;if(t.src==='local')return true;
  if(!Store.premium&&cachedIds.size>=FREE_CACHE_LIMIT){note(`Free downloads hold ${FREE_CACHE_LIMIT} songs — Premium is unlimited`);return false}
  if(btn)btn.classList.add('busy');let full=false,src=null;
  try{src=await fullFileFor(t);full=!!src;if(!src&&t.preview)src=await fetchBlob(t.preview);
    if(!src){note(t.src==='youtube'?'Videos stream only — they can’t be saved offline':'This source can’t be saved offline');return false}
    const w=await toWav(src);const blob=w?w.wav:src;
    const[lyr,artBlob]=await Promise.all([SLyrics.fetchLyrics(t).catch(()=>null),t.art&&!t.art.startsWith('data:')?fetchBlob(t.art):null]);
    await IDB.put('audio',t.id,{blob,meta:{...t,versions:undefined},full,format:w?'wav':'original',duration:w?w.dur:0,lyrics:lyr?{...lyr,candidates:undefined}:null,art:artBlob||null,fx:null,at:Date.now(),size:blob.size});
    cachedIds.add(t.id);if(!full&&(t.src!=='youtube'))note(cur&&cur.id===t.id&&eng.kind==='yt'?'The full song streams through YouTube — the 30-second preview was saved':'Saved');
    if(cur&&cur.id===t.id){$$('#np [data-act=dl]').forEach(b=>{b.classList.add('on');b.innerHTML=I('downloaded')})}refreshSide();return true}
  finally{if(btn)btn.classList.remove('busy')}}
async function cacheMany(list,label){openSheet(`${sheetH('Downloading')}<p class="mut small">${esc(label||'')}</p><div class="progress"><i id="cp"></i></div><p class="mut small" id="cpt">Starting…</p>`);let ok=0,i=0;
  for(const t of list){if(!$('#sheet').classList.contains('on'))break;if(await cacheTrack(t))ok++;i++;const p=$('#cp');if(p)p.style.width=i/list.length*100+'%';const pt=$('#cpt');if(pt)pt.textContent=`${i} of ${list.length} · ${ok} saved`;await sleep(40)}
  const pt=$('#cpt');if(pt)pt.textContent=`${ok} of ${list.length} songs ready offline`}

function shareURL(t,lines){const base=/^https?:$/.test(location.protocol)&&!/^(localhost|127\.)/.test(location.hostname)?location.origin+location.pathname:SITE;const id=String(t.id).replace(/^(it|dz|au|yt):/,'$1');return base+'#t-'+id+(lines&&lines.length?'~'+lines.join('.'):'')}
async function sharedTrack(raw){const m=raw.match(/^(it|dz|au|yt)?(.+)$/);const kind=m[1]||'it',id=m[2];
  if(kind==='it')return API.lookupTrack('it:'+id);if(kind==='dz')return SSrc.Deezer.track(id);if(kind==='yt')return{id:'yt:'+id,src:'youtube',ytId:id,title:'Shared video',artist:'',art:`https://i.ytimg.com/vi/${id}/hqdefault.jpg`};
  if(kind==='au'){const r=await SSrc.get(`https://api.audius.co/v1/tracks/${id}?app_name=sniplit`).catch(()=>null);return r&&r.data?{id:'au:'+id,src:'audius',auId:id,title:r.data.title,artist:r.data.user&&r.data.user.name,art:r.data.artwork&&r.data.artwork['480x480']}:null}return null}

async function drawLyricCard(c,t,lines,link){const x=c.getContext('2d');x.fillStyle='#0a0a0a';x.fillRect(0,0,c.width,c.height);
  try{const img=await loadImg(t.art);x.save();x.filter='blur(40px) saturate(1.2) brightness(.45)';x.drawImage(img,-100,-100,c.width+200,c.height+200);x.restore();x.save();x.beginPath();x.roundRect(80,80,180,180,22);x.clip();x.drawImage(img,80,80,180,180);x.restore()}catch(e){const g=x.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#1d1d1d');g.addColorStop(1,'#060606');x.fillStyle=g;x.fillRect(0,0,c.width,c.height)}
  x.fillStyle='#fff';x.font='700 40px Inter,Arial';x.fillText(t.title.slice(0,32),290,150);x.fillStyle='#bbb';x.font='500 32px Inter,Arial';x.fillText(t.artist.slice(0,36),290,200);
  x.fillStyle='#fff';x.font='800 64px Inter,Arial';let y=420;for(const l of lines){for(const w of wrap(x,l,920)){x.fillText(w,80,y);y+=80}y+=24;if(y>1180)break}x.font='700 34px Inter,Arial';x.fillStyle='#fff';x.fillText('▷ sniplit',80,1250);x.font='500 24px Inter,Arial';x.fillStyle='rgba(255,255,255,.6)';x.fillText((link||SITE).replace(/^https?:\/\//,'').slice(0,60),80,1292)}
function wrap(x,s,w){const out=[];let line='';for(const word of s.split(' ')){const t=line?line+' '+word:word;if(x.measureText(t).width>w&&line){out.push(line);line=word}else line=t}if(line)out.push(line);return out}
function loadImg(src){const one=u=>new Promise((r,j)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=j;i.src=u});if(!src)return Promise.reject();const u=thumb(src,600)||src;return one(u+(u.includes('?')?'&':'?')+'sncard=1').catch(()=>one(src+(src.includes('?')?'&':'?')+'sncard=2'))}

async function drawWave(){const c=$('#wv');if(!c)return;const dpr=devicePixelRatio||1;c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;const x=c.getContext('2d');const W=c.width,H=c.height;

function summarize(entries,minutes){const tr={},ar={},gn={};for(const h of entries){const k=h.track.id;tr[k]=tr[k]||{t:h.track,n:0};tr[k].n++;const a=h.track.artist.split(/,|&/)[0].trim();ar[a]=(ar[a]||0)+(h.ms||30000);if(h.track.genre)gn[h.track.genre]=(gn[h.track.genre]||0)+1}
  const tt=Object.values(tr).sort((a,b)=>b.n-a.n),ta=Object.entries(ar).sort((a,b)=>b[1]-a[1]),tg=Object.entries(gn).sort((a,b)=>b[1]-a[1]);
  const slim=t=>({title:t.title,artist:t.artist,art:t.art,id:t.id,preview:t.preview,album:t.album,durationMs:t.durationMs,artistId:t.artistId,src:t.src});
  return{minutes,plays:entries.length,tracks:tt.slice(0,5).map(x=>({...slim(x.t),n:x.n})),artists:ta.slice(0,5).map(x=>x[0]),genre:tg[0]?.[0]||null,artists_n:ta.length}}
function myDayStory(){const age=Date.now()-(Store.stats.first||Date.now());if(age<3*864e5)return null;const day=today();const mins=Math.round((Store.stats.days[day]||0)/60000);if(mins<10)return null;
  const start=new Date(day+'T00:00:00').getTime();const e=Store.history.filter(h=>h.at>=start&&!h.imported);if(e.length<3)return null;return{kind:'day',date:day,...summarize(e,mins)}}
function myYearStory(force){const d=new Date(),m=d.getMonth(),dd=d.getDate();const inWin=(m===11&&dd===31)||(m===0&&dd<=14);if(!inWin&&!force)return null;const y=m===0?d.getFullYear()-1:d.getFullYear();
  const days=Object.entries(Store.stats.days).filter(([k])=>k.startsWith(String(y)));const mins=Math.round(days.reduce((a,[,v])=>a+v,0)/60000);if(days.length<20||mins<300)return null;
  if((Store.stats.first||Date.now())>new Date(y,10,1).getTime())return null;const e=Store.history.filter(h=>new Date(h.at).getFullYear()===y);
  const s=summarize(e,mins);const hrs=Store.stats.hours;const peak=hrs.indexOf(Math.max(...hrs));const persona=s.artists_n>60?'The Explorer':s.tracks[0]&&s.tracks[0].n>e.length*.08?'The Loyalist':mins>6000?'The Marathoner':'The Curator';
  return{kind:'year',year:y,...s,peak,persona,days:days.length}}

function tasteMatch(x){const pr=profile();const mine=new Set(pr.artists.slice(0,25).map(a=>artistKey(a.name)));const mg=new Set(pr.genres.slice(0,6));const sa=x.artists.filter(a=>mine.has(artistKey(a)));const sg=x.genres.filter(g=>mg.has(g));return{score:sa.length*3+sg.length+(x.now?.5:0)+Math.max(0,1-(Date.now()-x.at)/864e5),sa,sg}}

  return list.slice(0,30).map(x=>{const why=x.m.sa.length?`${x.m.sa.length} artist${x.m.sa.length>1?'s':''} in common · ${esc(x.m.sa.slice(0,2).join(', '))}`:x.now?`Listening to ${esc(x.now.title)} · ${esc(x.now.artist)}`:x.artists.length?`Into ${esc(x.artists.slice(0,2).join(', '))}`:`Active ${ago(x.at)}`;

V.export=v=>{v.innerHTML=`<h1>Export your library</h1><p class="sub">Playlists, collections, ratings, listening history, metadata and preferences — in open formats.</p>

  v.innerHTML=`<div class="hero prem"><div><span class="kicker">sniplit Premium</span><h1>Everything, uncapped.</h1><p>Free keeps every feature. Premium removes the limits.</p><button class="pill" id="gp">${Store.premium?'Manage Premium':'Try it free for 7 days'}</button></div></div>

V.preferences=(v,sec)=>{const s=Store.settings,me=SSocial.me;if(s.preciseSync===undefined)s.preciseSync=Lyr.precise();if(s.discordOn===undefined)s.discordOn=s.discord!==false;const tg=(k,l,d,obj='s')=>`<div class="set-row"><div>${l}${d?`<small>${d}</small>`:''}</div><button class="toggle ${(obj==='me'?me[k]:s[k])?'on':''}" data-${obj==='me'?'soc':'set'}="${k}" aria-label="${l}"></button></div>`;
  v.innerHTML=`<div class="coll-h small">${avatar(me.name||'You',me.id,64)}<div class="grow"><h1>${esc(me.name||'Settings')}</h1><p class="mut">${Store.premium?'Premium':'Free'} · ${fmt(Store.stats.ms/1000)} listened · no account needed</p></div></div>
  <div class="grid2" style="align-items:start;margin-top:18px">
  <div class="card"><h3>Appearance</h3><div class="set-row"><div>Theme</div><div class="seg" style="min-width:210px">${['dark','light','system'].map(t=>`<button data-theme="${t}" class="${s.theme===t?'on':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>
   <div class="set-row"><div>Accent</div><div class="swatches">${['#ffffff','#a3a3ff','#7ee0b4','#f5c451','#f57c3b','#3b9cf5'].map(c=>`<button class="sw ${s.accent===c?'on':''}" style="background:${c}" data-acc="${c}" aria-label="Accent ${c}"></button>`).join('')}</div></div>
   <div class="set-row"><div>Layout<small>Auto picks phone, desktop or TV</small></div><select data-sel="layout" style="width:auto">${[['auto','Auto'],['mobile','Phone'],['desktop','Desktop'],['tv','TV']].map(([x,l])=>`<option value="${x}" ${s.layout===x?'selected':''}>${l}</option>`).join('')}</select></div>
   ${tg('reduceMotion','Reduce motion')}${tg('compact','Compact')}</div>
  <div class="card"><h3>Playback</h3>${tg('keepAwake','Keep awake while playing','Stops power-saving from cutting playback')}${tg('fxBackground','Studio effects in the background (iPhone)','Off keeps music playing when the phone locks')}${tg('autoFull','Full songs automatically','Premium · uses video sources when available')}${tg('explicit','Prefer explicit versions')}${tg('preciseSync','Check lyric timing by ear','Listens to the vocals to confirm where each line lands. Downloads a small speech model once.')}</div>
  <div class="card"><h3>Privacy</h3>${tg('share','Share what I’m listening to','Friends see now playing and your daily recap','me')}${tg('sharePlaylists','Share my playlists with friends','Mark single playlists private from the playlist page','me')}${tg('discoverable','Show me in Find friends','Lists your name and a few favourite artists so people can add you','me')}</div>
  <div class="card" id="connections"><h3>Connections</h3><p class="small mut" style="margin:0 0 10px">Nothing here is needed to listen. These only add account syncing and Last.fm imports.</p>
   <label class="small mut">Spotify Client ID (optional) · redirect ${esc(location.origin+location.pathname)}</label><input data-text="spotifyClientId" value="${esc(s.spotifyClientId)}" style="margin:6px 0 12px">
   <label class="small mut">Last.fm API key (for importing your Last.fm history)</label><input data-text="lastfmKey" value="${esc(s.lastfmKey)}" style="margin:6px 0 12px">
   <label class="small mut">Friends relay (optional, wss://…)</label><input data-text="broker" value="${esc(s.broker||'')}" placeholder="Uses public relays by default" style="margin:6px 0 12px">
   <div class="set-row"><div>Linked accounts<small>${Object.keys(Store.linked).map(k=>k+' · '+(Store.linked[k].lastSync?ago(Store.linked[k].lastSync):'never')).join(' · ')||'None'}</small></div><button class="pill sm ghost" id="chk">${I('refresh')} Check now</button></div></div>
  <div class="card"><h3>Discord</h3>${window.sniplitDesktop?`${tg('discordOn','Show what I’m playing on Discord','Appears as “Listening to …” on your profile')}<div class="set-row"><div>When this computer is idle, show<small>Link your phone as a friend, then pick it here</small></div><select data-sel="discordMirror" style="width:auto"><option value="">Nothing</option>${Object.values(me.friends).map(f=>`<option value="${f.id}" ${s.discordMirror===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div><p class="tiny mut" id="dstat"></p>`:`<p class="mut small">Discord shows your music through the sniplit desktop app (Windows, macOS, Linux). To show what’s playing on this phone: open the desktop app, add this phone as a friend from the Friends tab, then choose it under Settings → Discord.</p>`}</div>
  <div class="card"><h3>Your data</h3><div class="set-row"><div>Bring your library</div><a class="pill sm ghost" href="#import">Open</a></div><div class="set-row"><div>Export your library</div><a class="pill sm ghost" href="#export">Open</a></div>
   <div class="set-row"><div>Install the app</div><button class="pill sm ghost" id="inst">Install</button></div><div class="set-row"><div>Reset this device<small>Clears likes, history and playlists here</small></div><button class="pill sm ghost" id="rst">Reset</button></div></div>
  <div class="card"><h3>Premium</h3><div class="set-row"><div>${Store.premium?'Premium is on':'Free'}<small>Full songs, unlimited downloads, studio-grade exports</small></div><a class="pill sm" href="#premium">${Store.premium?'Manage':'See Premium'}</a></div></div></div>
  <p class="tiny mut" style="margin-top:18px"><a href="#terms">Terms of Use</a> · <a href="#privacy">Privacy Policy</a> · sniplit 3.0</p>`;
  if(sec==='connections')setTimeout(()=>$('#connections').scrollIntoView({behavior:'smooth'}),100);
  v.onclick=async e=>{const t=e.target.closest('[data-set]');if(t){s[t.dataset.set]=!s[t.dataset.set];t.classList.toggle('on');Store.save('settings');applyLayout()}
    const so=e.target.closest('[data-soc]');if(so){SSocial.setOpt(so.dataset.soc,!me[so.dataset.soc]);so.classList.toggle('on')}
    const th=e.target.closest('[data-theme]');if(th){s.theme=th.dataset.theme;Store.save('settings');applyLayout();route()}const ac=e.target.closest('[data-acc]');if(ac){s.accent=ac.dataset.acc;Store.save('settings');applyLayout();route()}
    const ck=e.target.closest('#chk');if(ck){ck.classList.add('busy');await SImport.Linked.checkAll();ck.classList.remove('busy');route()}
    if(e.target.closest('#inst')){if(window.__bip)__bip.prompt();else{const b=e.target.closest('#inst');b.textContent=/iP(hone|ad)/.test(navigator.userAgent)?'Share → Add to Home Screen':'Use your browser’s Install option'}}
    const rs=e.target.closest('#rst');if(rs){if(rs.dataset.sure){localStorage.clear();location.reload()}else{rs.dataset.sure=1;rs.textContent='Tap again to reset'}}};
  v.onchange=e=>{const t=e.target;if(t.dataset.text!=null){s[t.dataset.text]=t.value.trim();Store.save('settings')}if(t.dataset.sel){s[t.dataset.sel]=t.value;Store.save('settings');applyLayout();renderShell();discordPush()}};
  if(window.sniplitDesktop)sniplitDesktop.discordStatus().then(st=>{const el=$('#dstat');if(el)el.textContent=!st.configured?'Discord isn’t configured in this build.':st.connected?'Connected to Discord.':'Waiting for the Discord app to open…'})};

/* ---------- boot ---------- */
addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__bip=e});
document.addEventListener('gesturestart',e=>e.preventDefault());
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if(Store.settings.theme==='system')applyLayout()});
if('serviceWorker'in navigator&&(/^(https|sniplit):$/.test(location.protocol)||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
/* updates: installed copies (Android, desktop, the downloaded file) compare their build with the published one and offer
   the new download; the website itself updates through its service worker and offers a one-tap restart */
const SITE_DIR=()=>SITE.replace(/[^/]*(#.*)?$/,'');
async function checkUpdate(){if(!navigator.onLine)return;try{const r=await fetch(SITE_DIR()+'version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=await r.json();
  const mine=window.SNIPLIT_BUILD;if(!mine||!v.build||v.build===mine||SData.LS.get('skipUpdate','')===v.build)return;
  const A=window.sniplitAndroid,D=window.sniplitDesktop;const dl=A?'downloads/sniplit.apk':D?(D.platform==='darwin'?'downloads/sniplit.dmg':'downloads/sniplit-Setup.exe'):'sniplit.html';
  updateBar(`sniplit ${esc(v.version||'')} is available`,A||D||location.protocol==='file:'?`<a class="pill sm" href="${esc(SITE_DIR()+dl)}" download target="_blank" rel="noopener">${I('download')} Download update</a>`:`<button class="pill sm" data-upd="reload">Update now</button>`,v.build)}catch(e){}}
function updateBar(text,action,build){if($('#updbar'))return;const d=document.createElement('div');d.id='updbar';d.className='updbar';d.innerHTML=`${I('refresh')}<span class="grow">${text}</span>${action}<button class="icon-btn" data-upd="later" aria-label="Later">${I('close')}</button>`;document.body.appendChild(d);requestAnimationFrame(()=>d.classList.add('on'));
  d.onclick=e=>{const b=e.target.closest('[data-upd]');if(!b)return;if(b.dataset.upd==='reload')location.reload();if(b.dataset.upd==='later'){if(build)SData.LS.set('skipUpdate',build);d.classList.remove('on');setTimeout(()=>d.remove(),400)}}}
if('serviceWorker'in navigator)navigator.serviceWorker.addEventListener('controllerchange',()=>{if(window.__swHadController)updateBar('A new version of sniplit is ready',`<button class="pill sm" data-upd="reload">Restart</button>`)});
window.__swHadController=!!(navigator.serviceWorker&&navigator.serviceWorker.controller);
setTimeout(checkUpdate,8000);setInterval(checkUpdate,6*36e5);
/* gentle reveal: sections and cards fade up the first time they scroll into view */
const RV_SEL='#view .sec,#view .card,#view .genre,#view .lib-row,#view .friend,#view .about,#view .coll-h,#view .top-hit,#view .list-h,#view .hero,#view .mix,#view .set-row';
const rvIO='IntersectionObserver'in window?new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){e.target.classList.add('in');rvIO.unobserve(e.target)}},{rootMargin:'0px 0px -6% 0px',threshold:.01}):null;
function reveal(){if(!rvIO||document.body.classList.contains('reduce'))return;let n=0;for(const el of document.querySelectorAll(RV_SEL)){if(el.dataset.rv)continue;el.dataset.rv=1;const r=el.getBoundingClientRect();if(r.top<innerHeight*.92)continue;el.classList.add('rv');el.style.setProperty('--rvd',Math.min(n++,6)*40+'ms');rvIO.observe(el)}}
new MutationObserver(()=>{clearTimeout(reveal.t);reveal.t=setTimeout(reveal,30)}).observe(document.getElementById('view')||document.body,{childList:true,subtree:true});
async function boot(){const fx=Store.settings.fx;if(fx){Object.assign(eng.fx,fx,{eq:[...(fx.eq||eng.fx.eq)]})}applyLayout();renderShell();
  Store.restore().then(n=>{if(n){applyLayout();renderShell();refreshSide&&refreshSide();route()}});
  const qs=new URLSearchParams(location.search);if(qs.get('code')&&qs.get('state')==='spotify'){try{await SImport.Linked.spotifyFinish(qs.get('code'));history.replaceState(null,'',location.pathname+'#import');setTimeout(async()=>{await SImport.applyImport(await SImport.Linked.spotifyPull());refreshSide()},500)}catch(e){}}
  if(Store.queueState&&Store.queueState.list&&Store.queueState.list.length){Q.list=Store.queueState.list;Q.i=Store.queueState.i;Q.ctx=Store.queueState.ctx;cur=Q.list[Q.i];renderMini()}
  IDB.keys('audio').then(async k=>{Store.cachedMeta=(await Promise.all(k.slice(0,300).map(x=>IDB.get('audio',x)))).filter(Boolean).map(x=>x.meta)});
  await route();
  if(Object.keys(SSocial.me.friends).length||Object.keys(SSocial.me.out).length)SSocial.start();
  const last=Math.max(0,...Object.values(Store.linked).map(x=>x.lastSync||0));if(Object.keys(Store.linked).length&&Date.now()-last>216e5)SImport.Linked.checkAll().then(refreshSide);
}
window.sniplit={cacheTrack,eng,Q,playList,openNP,closeNP,setPane,editorSheet,castSheet,exportSheet,shareSheet,createSheet,openStory,myDayStory,myYearStory,go,Lyr,API,Store,viz};
boot();
})();
